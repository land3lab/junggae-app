<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜드3 사무실</title>
<style>
/* VOICE: 귀여운 사무실 시뮬레이션 — 직원들이 실제로 일하는 게 보이는 운영 화면
   IDEA: 위에서 내려다본 중개사무소 평면도, 방마다 팀
   PICTURE: 평면도 자체(캐릭터·책상·말풍선)가 화면의 절반 이상
   COLOUR/TYPE: 랜드3 주황 #F77235 + 차콜 #23292B, 나무 바닥 / 밤엔 어두운 바닥 · Noto Sans KR
   LAYOUT: 왼쪽 평면도, 오른쪽 팀 현황·태스크, 아래 이벤트 로그 */
:root{color-scheme:light dark;
  --bg:light-dark(#F6F3EE,#14171A);--panel:light-dark(#FFFFFF,#1D2226);--ink:light-dark(#23292B,#EDEFF1);--mut:light-dark(#7A8086,#8E969D);
  --line:light-dark(#E7E0D4,#2C3338);--wall:light-dark(#EEF0F3,#1A1F24);--floor:light-dark(#D9B48A,#2E2419);--floor2:light-dark(#D2AB80,#2A2117);
  --zone:light-dark(rgba(255,255,255,.22),rgba(255,255,255,.035));--zl:light-dark(rgba(120,80,40,.35),rgba(255,255,255,.14));
  --card:light-dark(#FFFFFF,#22292E);--or:#F77235;--btn:#EE6A2C;--ok:#2E9E5B;--wait:#9AA0A6;--bad:#E5484D;--collab:#7C5CFF;--desk:light-dark(#9C6B43,#5A3F28)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.logo small{font-weight:500;color:var(--mut);font-size:13px}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.clock span{color:var(--mut);font-weight:500;margin-right:8px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 54px)}
.embed header{display:none}.embed .layout{min-height:100vh}.embed .side{max-height:100vh}
.mapwrap{overflow:auto;position:relative}
#stage{position:relative;width:1200px;height:628px;transform-origin:0 0;background:repeating-linear-gradient(90deg,var(--floor) 0 58px,var(--floor2) 58px 60px)}
.wallband{position:absolute;left:0;top:0;width:1200px;height:168px;background:var(--wall);border-bottom:4px solid light-dark(#C9CDD3,#0E1114)}
.zone{position:absolute;border:2px dashed var(--zl);border-radius:10px;background:var(--zone)}
.zone b{position:absolute;top:-11px;left:12px;font-size:12px;font-weight:800;color:var(--or);background:var(--bg);padding:0 6px;border-radius:4px;white-space:nowrap}
.zone.top b{background:var(--wall)}
.furn{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.plant{position:absolute;width:22px;height:30px}
.agent{position:absolute;transform:translate(-50%,-100%);transition:left 1.7s linear,top 1.7s linear;cursor:pointer;z-index:3;width:46px}
.agent svg.sp{display:block;width:46px;height:57px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.agent.walk svg.sp{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.agent.work svg.sp{animation:busy 1.2s ease-in-out infinite}
@keyframes busy{50%{transform:translateY(-1px) rotate(-1.5deg)}}
.agent.sel .card{outline:2px solid var(--or)}
.card{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;background:var(--card);border:1.5px solid var(--rc,#ccc);border-radius:7px;padding:2px 7px 3px;text-align:center;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);font-size:11px;line-height:1.35}
.card .nm{font-weight:800;font-size:12.5px}
.card .rl{color:var(--rc);font-weight:700;font-size:10.5px}
.card .st{color:var(--mut);font-size:10.5px}
.card .st i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wait);margin-right:3px;vertical-align:1px}
.st.work i{background:var(--ok)}.st.collab i{background:var(--collab)}.st.blocked i{background:var(--bad)}.st.rest i{background:#E7A400}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;background:var(--card);color:var(--ink);border-radius:9px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;max-width:116px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.15);opacity:0;transition:opacity .25s;pointer-events:none}
.bub.on{opacity:1}
.bub.done{background:light-dark(#E7F6EC,#1F3A2A);color:var(--ok)}
.bub.collab{background:light-dark(#EFEAFF,#2C2550);color:var(--collab)}
.bub.blocked{background:light-dark(#FDECEC,#3D2022);color:var(--bad)}
.side{background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100vh - 54px)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px}
.box h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.box h3 .pill{margin-left:auto;font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.box h3 .pill:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:1px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kpi div{border:1px solid var(--line);border-radius:9px;text-align:center;padding:7px 2px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mut)}
.k-ok b{color:var(--ok)}.k-bad b{color:var(--bad)}.k-c b{color:var(--collab)}
.usage{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.usage div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.usage small{color:var(--mut);font-size:11px}
.task{border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:6px;font-size:13px}
.task .t{display:flex;gap:6px;align-items:center;font-weight:700}
.task .t .p{font-size:10px;color:#fff;background:var(--btn);border-radius:4px;padding:0 4px}
.task .t .p.m{background:#4C6EF5}
.task .who{font-size:11.5px;color:var(--mut);margin:2px 0 5px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .9s linear}
.done-list{padding:0;margin:0}
.done-list li{font-size:12.5px;margin:3px 0;list-style:none}
.done-list li:before{content:"✓ ";color:var(--ok);font-weight:800}
.prof{display:flex;gap:10px;align-items:center}
.prof .av{width:64px;height:64px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.prof .rl{color:var(--or);font-weight:700;font-size:12.5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
button,.lnk{font:inherit;border:0;border-radius:9px;padding:9px 10px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;min-height:40px}
.b-or{background:#F5B342;color:#23292B}.b-gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.energy{margin-top:8px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.en i{background:linear-gradient(90deg,#4CC38A,#F5B342)}
.close{margin-left:auto;background:none;border:0;color:var(--mut);font-weight:600;min-height:0;padding:0}
.leftcol{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.log{border-top:1px solid var(--line);background:var(--panel);flex:1}
.log summary{padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px;display:flex}
.log summary span{margin-left:auto;color:var(--mut);font-weight:500}
.log ol{margin:0;padding:0 16px 12px;max-height:260px;overflow:auto;list-style:none;font-size:12.5px}
.log li{padding:2px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:8px}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.on{display:flex}
.chat{background:var(--panel);border-radius:16px;width:min(980px,100%);height:min(640px,94vh);display:grid;grid-template-columns:270px minmax(0,1fr);overflow:hidden;border:1px solid var(--line)}
.chat .left{border-right:1px solid var(--line);padding:18px;text-align:center;overflow:auto}
.chat .left .av{width:120px;height:120px;margin:4px auto 10px;border:2px solid var(--or);border-radius:16px;display:grid;place-items:center;background:var(--bg)}
.chat dl{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;text-align:left;font-size:13px;margin:14px 0}
.chat dt{color:var(--mut)}.chat dd{margin:0;text-align:right;font-weight:700}
.chat .right{display:flex;flex-direction:column;min-height:0}
.chat .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.m .mini{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--or);flex:none;display:grid;place-items:center}
.m p{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 11px;white-space:pre-wrap;font-size:14px}
.m time{display:block;text-align:right;font-size:10.5px;color:var(--mut);margin-top:2px}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me p{background:#F5B342;color:#23292B;border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line)}
.chips button{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:13px;padding:5px 11px;min-height:32px;border-radius:99px}
.send{display:flex;gap:8px;padding:10px 14px 14px}
.send input{flex:1;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px}
.note{font-size:11.5px;color:var(--mut);padding:0 16px 8px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{max-height:none}
  .mapwrap{border-right:0}
  .chat{grid-template-columns:1fr;height:94vh}
  .chat .left{display:none}
  .logo small{display:none}
  .clock span{display:none}
}
@media (prefers-reduced-motion:reduce){.agent{transition:none}.agent svg.sp{animation:none!important}}
</style>
</head>

    await moveTo(a, p.s.x + 56, p.s.y + 22);
    setStatus(a, "collab"); setStatus(p, "collab");
    say(a, "협업중", "collab"); say(p, "협업중", "collab");
    log(`${a.s.name} ↔ ${p.s.name} 협업`);
    await sleep(5200);
    say(p, "완료 ✓", "done", 2500); setStatus(p, "idle");
    await home(a);
  }
  t.dur = 14 + Math.random()*16;
  setStatus(a, "work"); say(a, `작업중 · ${t.title}`);
}
function finish(a){
  const t = a.task; if (!t) return;
  tasks.splice(tasks.indexOf(t), 1); a.task = null;
  done.unshift({ title:t.title, who:a.s.name, at:now().slice(0,5) }); done.length = Math.min(done.length, 30);
  tokIn += 900 + Math.round(Math.random()*1800); tokOut += 500 + Math.round(Math.random()*1500);
  setStatus(a, "idle"); say(a, "완료 ✓", "done", 3500);
  a.energy = Math.max(5, a.energy - 8 - Math.round(Math.random()*8));
  log(`${a.s.name} · "${t.title}" 완료`);
  (t.def.next || []).forEach((nid, k) => setTimeout(() => { const n = A[nid]; if (n) startTask(n, n.s.tasks[0], "H"); }, 2500 + k*1800));
}
async function rest(a){
  setStatus(a, "walk"); say(a, "커피 한 잔 하고 올게요 ☕", "", 2500);
  const sp = LOUNGE[Math.floor(Math.random()*LOUNGE.length)];
  await moveTo(a, sp.x + Math.random()*20, sp.y);
  setStatus(a, "rest"); log(`${a.s.name} · 휴게실에서 휴식`);
  await sleep(7000 + Math.random()*5000);
  a.energy = Math.min(100, a.energy + 35);
  await home(a); setStatus(a, "idle");
}
async function meeting(){
  const idle = Object.values(A).filter((a) => a.status==="idle");
  if (idle.length < 3) return;
  const g = idle.sort(() => Math.random()-.5).slice(0,3);
  log(`회의실 · ${g.map((a)=>a.s.name).join(", ")} 주간 회의`);
  await Promise.all(g.map((a, k) => { setStatus(a, "walk"); return moveTo(a, 600 + k*58, 104 + (k%2)*30); }));
  g.forEach((a) => { setStatus(a, "collab", "회의중"); say(a, "회의중", "collab"); });
  await sleep(8000);
  await Promise.all(g.map((a) => { say(a, "회의 끝!", "done", 2000); return home(a).then(() => setStatus(a, "idle")); }));
}

setInterval(() => {
  Object.values(A).forEach((a) => {
    const t = a.task;
    if (!t || a.status !== "work") return;
    if (t.def.block && t.prog > 45 && !t.blockedOnce){
      t.blockedOnce = true; setStatus(a, "blocked"); say(a, "가압류 발견! 확인 필요 🔴", "blocked");
      log(`${a.s.name} · 막힘 — 등기부에 가압류, 사람 확인 필요`);
      setTimeout(() => { if (a.status==="blocked"){ setStatus(a, "work"); say(a, "확인 완료, 다시 진행"); log(`${a.s.name} · 막힘 해소`); } }, 9000);
      return;
    }
    t.prog = Math.min(100, t.prog + 100 / t.dur);
    if (t.prog >= 100) finish(a);
  });
  paint();
}, 1000);
setInterval(() => {
  const idle = Object.values(A).filter((a) => a.status==="idle");
  if (!idle.length) return;
  const a = idle[Math.floor(Math.random()*idle.length)];
  if (a.energy < 35 && Math.random() < .7) { rest(a); return; }
  if (Math.random() < .1) { meeting(); return; }
  startTask(a, a.s.tasks[Math.floor(Math.random()*a.s.tasks.length)], Math.random() < .35 ? "H" : "M");
}, 3200);

function paint(){
  const all = Object.values(A), c = (f) => all.filter(f).length;
  $("k-work").textContent = c((a) => a.status==="work" || a.status==="collab");
  $("k-block").textContent = c((a) => a.status==="blocked");
  $("k-idle").textContent = c((a) => a.status==="idle" || a.status==="rest");
  $("k-run").textContent = tasks.length; $("run-n").textContent = tasks.length;
  $("k-done").textContent = done.length; $("done-n").textContent = done.length;
  $("u-in").textContent = tokIn.toLocaleString("ko-KR");
  $("u-out").textContent = tokOut.toLocaleString("ko-KR");
  $("u-cost").textContent = Math.round((tokIn*3 + tokOut*15) / 1e6 * 1400).toLocaleString("ko-KR") + "원";
  $("tasks").innerHTML = tasks.length ? tasks.slice(-6).reverse().map((t) => `<div class="task"><div class="t"><span class="p ${t.prio==="H"?"":"m"}">${t.prio}</span>${esc(t.title)}</div>
    <div class="who">${A[t.owner].status==="blocked" ? '<b style="color:var(--bad)">막힘</b>' : "진행중"} · ${esc(BY[t.owner].name)}</div><div class="bar"><i style="width:${t.prog.toFixed(0)}%"></i></div></div>`).join("")
    : `<div style="color:var(--mut);font-size:13px">지금은 모두 대기 중이에요</div>`;
  $("done").innerHTML = done.slice(0,6).map((d) => `<li>${esc(d.title)} <span style="color:var(--mut)">· ${esc(d.who)} ${d.at}</span></li>`).join("") || `<li style="color:var(--mut)">아직 없어요</li>`;
  if (sel) renderSel(true);
}
function renderSel(light){
  const a = A[sel]; if (!a) return;
  const box = $("selbox"); box.hidden = false;
  if (light){ const b = box.querySelector(".en i"); if (b){ b.style.width = a.energy + "%"; box.querySelector(".en-v").textContent = a.energy; box.querySelector(".cur-st").textContent = a.el.querySelector(".st span").textContent; } return; }
  box.style.borderColor = "var(--or)";
  box.innerHTML = `<h3>${esc(a.s.name)} <button class="close" id="sel-x">닫기</button></h3>
    <div class="prof"><div class="av">${sprite(a.s.look,"",56)}</div><div>
      <div class="rl">${a.s.ic} ${esc(a.s.role)}</div>
      <div style="font-size:13px">● <span class="cur-st">${esc(a.el.querySelector(".st span").textContent)}</span></div>
      <div style="font-size:12.5px;color:var(--mut)">경력 ${esc(a.s.exp)} · 기분 ${esc(a.mood)}</div></div></div>
    <div class="btns"><button class="b-or" id="sel-chat">💬 1:1 면담</button><a class="lnk b-gh" href="${esc(a.s.link)}" ${IN_HUB && a.s.link.startsWith("/") ? 'target="_top"' : 'target="_blank" rel="noopener"'}>도구 열기 ↗</a></div>
    <div class="energy"><span>에너지</span><span class="en-v">${a.energy}</span></div><div class="bar en"><i style="width:${a.energy}%"></i></div>
    <p style="font-size:12.5px;color:var(--mut);margin:8px 0 0">${esc(a.s.about)}</p>`;
  $("sel-x").onclick = () => { $("selbox").hidden = true; A[sel].el.classList.remove("sel"); sel = null; };
  $("sel-chat").onclick = () => openChat(sel);
}
stage.addEventListener("click", (e) => {
  const ag = e.target.closest(".agent"); if (!ag) return;
  if (sel) A[sel].el.classList.remove("sel");
  sel = ag.dataset.id; ag.classList.add("sel"); renderSel();
  if (innerWidth <= 900) $("selbox").scrollIntoView({ behavior:"smooth", block:"nearest" });
});

/* ── 1:1 면담 ── */
let sampleFn = null, chatId = null, hist = [];
(async () => { try { if (window.claude && claude.use) sampleFn = await claude.use("sample"); } catch(e){ sampleFn = null; }
  if (chatId) $("c-note").textContent = note(); })();
const note = () => sampleFn ? "AI가 캐릭터로 답합니다 · 법령·금액은 최신 기준을 꼭 확인하세요" : "이 화면에서는 정해진 답만 해요 · claude.ai에서 열면 AI가 답합니다";
function openChat(id){
  const a = A[id]; chatId = id; hist = [];
  $("c-left").innerHTML = `<div class="av">${sprite(a.s.look,"",92)}</div><div style="font-size:19px;font-weight:800">${esc(a.s.name)}</div>
    <div style="color:var(--or);font-weight:700;font-size:13px">${a.s.ic} ${esc(a.s.role)}</div><div style="color:var(--mut);font-size:13px">경력 <b style="color:var(--or)">${esc(a.s.exp)}</b></div>
    <dl><dt>현재 상태</dt><dd>${esc(a.el.querySelector(".st span").textContent)}</dd><dt>기분</dt><dd>${esc(a.mood)}</dd><dt>에너지</dt><dd>${a.energy}</dd></dl>
    <div style="text-align:left;font-size:12px;color:var(--mut)">현재 태스크</div><div style="text-align:left;font-weight:700;font-size:13px">${a.task ? esc(a.task.title) : "없음"}</div>
    <div class="bar" style="margin-top:6px"><i style="width:${a.task ? a.task.prog.toFixed(0) : 0}%"></i></div>
    <a class="lnk b-gh" style="display:block;margin-top:16px" href="${esc(a.s.link)}" ${IN_HUB && a.s.link.startsWith("/") ? 'target="_top"' : 'target="_blank" rel="noopener"'}>${esc(a.s.role)} 도구 열기 ↗</a>`;
  $("msgs").innerHTML = "";
  $("chips").innerHTML = a.s.chips.map((c) => `<button type="button">${esc(c)}</button>`).join("");
  $("c-note").textContent = note();
  $("modal").classList.add("on");
  const d = new Date().getDay(), h = new Date().getHours();
  bot(`안녕하세요, ${a.s.role} 담당 ${a.s.name}예요 ${a.s.ic}`);
  setTimeout(() => bot(d===0||d===6 ? "근데 사장님… 주말인데 일 시키는 거 아니죠…? 😅" : h>=20 ? "퇴근 시간인데… 급한 일이세요? 🙂" : a.task ? `지금 "${a.task.title}" 하고 있어요. 뭐 도와드릴까요?` : "지금 손이 비어요. 뭐든 시켜 주세요!"), 700);
  setTimeout(() => $("inp").focus(), 50);
}
function bot(text){
  const el = document.createElement("div"); el.className = "m";
  el.innerHTML = `<div class="mini">${sprite(A[chatId].s.look,"",28)}</div><div><p></p><time>${now()}</time></div>`;
  el.querySelector("p").textContent = text;
  $("msgs").appendChild(el); $("msgs").scrollTop = 1e9; hist.push({ who:"bot", text }); return el.querySelector("p");
}
function me(text){
  const el = document.createElement("div"); el.className = "m me";
  el.innerHTML = `<div><p></p><time>${now()}</time></div>`; el.querySelector("p").textContent = text;
  $("msgs").appendChild(el); $("msgs").scrollTop = 1e9; hist.push({ who:"me", text });
}
function fallback(s, q){
  if (/주말|쉬|놀/.test(q)) return "...진짜요? 😂 알겠어요, 사장님 부탁이면 해야죠.";
  if (/시킬|해줘|써줘|뽑아|만들|정리/.test(q)) return `네! "${q}" 바로 시작할게요. 다 되면 말풍선에 완료 ✓ 띄울게요. 자세한 작업은 ${s.role} 도구에서 같이 보면 더 정확해요.`;
  return `${s.about.split(".")[0]}. 그 부분은 ${s.role} 도구를 열어서 같이 보면 좋겠어요!`;
}
async function ask(q){
  q = q.trim(); if (!q || !chatId) return;
  const a = A[chatId], s = a.s; me(q); $("inp").value = "";
  if (/시킬|해줘|써줘|뽑아|만들|정리/.test(q) && a.status==="idle") startTask(a, { t:q.slice(0,24) }, "H");
  const p = bot("…");
  if (!sampleFn){ await sleep(700); p.textContent = fallback(s, q); hist[hist.length-1].text = p.textContent; return; }
  const convo = hist.slice(0,-1).slice(-10).map((m) => (m.who==="me" ? "사장님: " : s.name + ": ") + m.text).join("\n");
  const prompt = `당신은 서울 관악구 공인중개사 사무소(미스터홈즈 관악센터, 랜드3 연구소)의 가상 직원 캐릭터 "${s.name}"입니다.
담당: ${s.role}. 성격: ${s.about}
지금 상태: ${a.el.querySelector(".st span").textContent}${a.task ? `, 하고 있는 일: ${a.task.title}` : ""}. 기분: ${a.mood}, 에너지 ${a.energy}.
규칙: 한국어 존댓말, 사장님(대표 공인중개사)과 메신저로 1:1 면담 중. 캐릭터 말투로 짧고 친근하게(보통 1~3문장, 이모지 0~1개).
사장님이 작업(제목·문구·목록·문자 초안 등)을 시키면 실제 결과물을 바로 써 준다(필요하면 길게, 목록 사용 가능).
모르는 사실·금액·법 조항 숫자를 지어내지 않는다. 법령·세율·요율은 "최신 기준 확인 필요"를 붙인다. 과장 광고 표현(최저가·무조건·수익 보장) 금지.
지금까지 대화:
${convo}
사장님: ${q}
${s.name}:`;
  try {
    const r = await sampleFn(prompt, { modelTier:"quick", cache:false, onText:({text}) => { p.textContent = text; $("msgs").scrollTop = 1e9; } });
    p.textContent = (r.text || "").trim() || "…";
  } catch(e){
    p.textContent = e && e.code==="rate_limited" ? "잠깐만요, 숨 좀 돌리고 답할게요 😮‍💨" : fallback(s, q);
  }
  hist[hist.length-1].text = p.textContent;
}
$("chips").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) ask(b.textContent); });
$("send").addEventListener("submit", (e) => { e.preventDefault(); ask($("inp").value); });
$("c-close").onclick = () => $("modal").classList.remove("on");
$("modal").addEventListener("click", (e) => { if (e.target.id==="modal") $("modal").classList.remove("on"); });
addEventListener("keydown", (e) => { if (e.key==="Escape") $("modal").classList.remove("on"); });

/* ── 화면 맞춤·시계 ── */
const wrap = $("mapwrap");
function fit(){
  const w = wrap.clientWidth;
  const k = innerWidth <= 900 ? Math.max(.6, Math.min(1, w/1200)) : Math.min(1.3, w/1200);
  stage.style.transform = `scale(${k})`;
  wrap.style.height = Math.ceil(628*k) + 4 + "px";
  stage.style.width = "1200px";
}
const ro = new ResizeObserver(fit); ro.observe(wrap); fit();
function tick(){ const d = new Date(); $("time").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("date").textContent = d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"}); }
tick(); setInterval(tick, 15000);

log("사무실 오픈 · 14명 출근");
setTimeout(() => startTask(A.listings, A.listings.s.tasks[0], "H"), 600);
setTimeout(() => startTask(A.editor, A.editor.s.tasks[0], "H"), 1400);
setTimeout(() => startTask(A.lh, A.lh.s.tasks[0], "M"), 2200);
setTimeout(() => startTask(A.desk, A.desk.s.tasks[0], "M"), 3000);
paint();
}
</script>
</body>
