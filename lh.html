<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LH 전세임대 사전점검 신호등 · 중개사무소 앱</title>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed")</script>
<style>.embed #app>header{display:none}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4d3f">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1d2321; --sub:#5d6662; --line:#e3e1da;
  --brand:#1f4d3f; --brand2:#2e6b58;
  --g:#1e9a5a; --gbg:#e5f5ec; --y:#c98a00; --ybg:#fdf3d8; --r:#d23b33; --rbg:#fbe6e4; --n:#8a918e; --nbg:#eef0ef;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:14px 16px 10px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
header .sub{font-size:12.5px;opacity:.85}
.notice{position:sticky;top:0;z-index:30;background:#fff7e0;border-bottom:1px solid #f0d98a;color:#6b5200;font-size:12.5px;padding:7px 16px;font-weight:500}
nav.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--brand)}
nav.tabs button{background:transparent;border:0;color:#cfe3db;padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:500}
nav.tabs button.on{background:var(--bg);color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%;min-width:0}
textarea{min-height:60px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--r);border-color:#f1c4c0}
.btn.sm{padding:5px 9px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--brand);background:#e8f0ec;color:var(--brand);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.green{background:var(--g)}.dot.yellow{background:var(--y)}.dot.red{background:var(--r)}.dot.gray{background:var(--n)}
.light{display:flex;gap:5px;padding:6px 7px;background:#222;border-radius:999px;flex:none}
.light i{width:14px;height:14px;border-radius:50%;background:#444;display:block}
.light.green i:nth-child(3){background:#2fd27b;box-shadow:0 0 8px #2fd27b}
.light.yellow i:nth-child(2){background:#ffc21a;box-shadow:0 0 8px #ffc21a}
.light.red i:nth-child(1){background:#ff4c40;box-shadow:0 0 8px #ff4c40}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.item:hover{border-color:#bfcfc8}
.item .t{font-weight:700;font-size:15.5px}
.item .m{color:var(--sub);font-size:13px}
.item .why{font-size:12.5px;margin-top:4px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--nbg);color:var(--sub);margin-right:4px;font-weight:500}
.tag.green{background:var(--gbg);color:var(--g)}.tag.yellow{background:var(--ybg);color:#8a5e00}.tag.red{background:var(--rbg);color:var(--r)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{flex:1;min-width:90px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14.5px;margin:18px 0 8px;color:var(--brand)}
.muted{color:var(--sub);font-size:12.5px}
.sheet{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:50;display:none;overflow:auto;padding:16px 8px}
.sheet.open{display:block}
.sheet .panel{max-width:860px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;position:relative}
.sheet .close{position:absolute;right:12px;top:10px}
table.rights{width:100%;border-collapse:collapse;font-size:13px}
table.rights th{background:#eef1ef;text-align:left;padding:6px;font-weight:500;color:var(--sub);white-space:nowrap}
table.rights td{border-top:1px solid var(--line);padding:4px;vertical-align:middle}
table.rights td input,table.rights td select{padding:5px 6px;font-size:13px}
table.rights tr.off td{opacity:.45}
table.rights tr.bad td:first-child{box-shadow:inset 3px 0 var(--r)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.verdict{border-radius:var(--radius);padding:14px;display:flex;gap:14px;align-items:flex-start}
.verdict.green{background:var(--gbg)}.verdict.yellow{background:var(--ybg)}.verdict.red{background:var(--rbg)}.verdict.gray{background:var(--nbg)}
.verdict .big{font-size:18px;font-weight:700}
.verdict ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.formula{font-size:13px;background:#fff;border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin-top:8px}
.drop{border:2px dashed #b9c9c2;border-radius:var(--radius);padding:18px;text-align:center;background:#fbfcfb;cursor:pointer}
.drop.hot{background:#e8f0ec;border-color:var(--brand)}
.status{font-size:13px;margin-top:8px}
.status.err{color:var(--r)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2321;color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;display:none}
.fab{position:fixed;right:16px;bottom:18px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dialog{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.dialog.open{display:flex}
.dialog .box{background:#fff;border-radius:14px;padding:16px;max-width:520px;width:100%}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:4px 0}
.check input{margin-top:4px}
.req{background:#fff;border:1px solid #f0d98a;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13px}
.req b{color:#8a5e00}
.cust header{background:#183c31}
.cust .item{cursor:default}
pre.copy{white-space:pre-wrap;background:#f4f4f1;border-radius:9px;padding:10px;font-size:12.5px;max-height:260px;overflow:auto;font-family:inherit}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d6d0;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.limits td input{min-width:70px}
/* ---- 모바일 사용성 ---- */
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.sm{min-height:38px}
.chip{min-height:38px}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],select{min-height:44px}
input[type=tel],input[type=password]{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
.check{min-height:40px;align-items:center}
.check input{width:22px;height:22px;margin-top:0;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{min-width:0;padding:6px 8px;text-align:center}
.stat b{font-size:19px}
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filterbar input{flex:1;min-width:150px}
.fpanel{margin-top:10px}
.fpanel.closed{display:none}
.hint{font-size:12px;color:var(--brand);font-weight:500;min-height:16px}
.notice .long{display:inline}
.list{padding-bottom:20px}
.fab{border-radius:999px;padding:12px 18px;font-size:15px}
.sheet .panel{padding-bottom:0}
.sheet .topbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:-16px -16px 8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.sheet .topbar h2{margin:0}
.savebar{position:sticky;bottom:0;background:var(--bg);margin:16px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;z-index:5}
.savebar .btn.pri{flex:1;max-width:260px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickrow .btn{min-height:56px;flex-direction:column;font-size:14px}
.pickrow .btn small{font-weight:400;color:var(--sub);font-size:11.5px}
.progress{height:6px;background:#e3e9e6;border-radius:9px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
@media(max-width:640px){
  .notice .long{display:none}
  .sheet{padding:0}
  .sheet .panel{border-radius:0;min-height:100%}
  .sheet .topbar{border-radius:0}
  .fpanel .grid3{grid-template-columns:1fr 1fr}
  .fpanel .grid3 label:first-child{grid-column:1/-1}
  table.rights thead{display:none}
  table.rights,table.rights tbody{display:block}
  table.rights tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px;border-top:1px solid var(--line)}
  table.rights tr:first-child{border-top:0}
  table.rights td{border:0;padding:0;display:block}
  table.rights td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--sub);margin-bottom:2px}
  table.rights td.wide{grid-column:1/-1}
  table.rights td input:not([type=checkbox]),table.rights td select{width:100%!important;min-width:0!important;min-height:42px;font-size:15px}
  table.rights td .check{white-space:nowrap;font-size:14px}
  table.rights tr.bad{box-shadow:inset 4px 0 var(--r)}
  table.rights tr.bad td:first-child{box-shadow:none}
  table.rights td.act{display:flex;align-items:end;justify-content:space-between;gap:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="dialog" id="dlg"><div class="box" id="dlgBox"></div></div>

<script>
/* ===================== 기본값 ===================== */
const DEFAULT_RULES = {
  threshold: 90,            // 부채비율 기준치(%)
  margin: 5,                // 기준치까지 여유가 이보다 적으면 노랑(%p)
  multipliers: { "공동주택": 1.0, "오피스텔": 1.0, "단독·다가구": 1.0 }, // 주택가격 = 공시가격 × 배율
  reReadDays: 14,           // 열람일 경과 시 재열람 요청(일)
  multiOtherShare: 30,      // 다가구: 타 호실 보증금 합계가 주택가격의 이 % 이상이면 노랑
  defects: "압류,가압류,가처분,신탁,경매개시,임의경매,강제경매,임차권등기,주택임차권",
  watch: "가등기,예고등기,환매",
  limits: [
    { label: "청년 1인", region: "수도권", amount: 12000, note: "2026년 2월 공고 예시" }
  ],
  office: { name: "", phone: "" },
  updatedNote: "기본값입니다. 최신 LH 공고를 확인해 수정하세요."
};
const TYPES = ["아파트","연립다세대","오피스텔","다가구","단독","기타"];
const REGIONS = ["수도권","광역시","기타"];
const SECTIONS = ["갑구","을구"];

/* ===================== 상태 ===================== */
const S = {
  db:null, sample:null, sampleImages:false, canWrite:true,
  rules: structuredClone(DEFAULT_RULES),
  listings: [], loaded:false, loadNote:"",
  tab:"list",
  filter:{ region:"", limitIdx:-1, maxDeposit:"", lights:new Set(), q:"" },
  edit:null, editFiles:[], parsing:false, parseMsg:"", parseErr:false,
  cust:null
};

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
function man(v){ // 만원 → "1억 2,000만원"
  v = Math.round(num(v)); if(!v) return "0원";
  const eok = Math.floor(v/10000), rest = v%10000;
  return (eok? eok+"억 ":"") + (rest? rest.toLocaleString()+"만원" : (eok? "원":"")).replace(/^원$/,"");
}
function manShort(v){ v=num(v); return v>=10000 ? (v/10000).toFixed(v%10000?2:0).replace(/\.?0+$/,"")+"억" : v.toLocaleString()+"만"; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display="none",2200); }
function daysSince(d){ if(!d) return null; const t=new Date(d+"T00:00:00"); if(isNaN(t)) return null; return Math.floor((Date.now()-t.getTime())/86400000); }
function regionOf(addr){
  addr = addr||"";
  if(/^(서울|경기|인천)/.test(addr.trim())) return "수도권";
  if(/^(부산|대구|광주|대전|울산|세종)/.test(addr.trim())) return "광역시";
  return addr.trim() ? "기타" : "";
}
function typeGroup(t){ return (t==="아파트"||t==="연립다세대") ? "공동주택" : t==="오피스텔" ? "오피스텔" : "단독·다가구"; }
function kw(list){ return String(list||"").split(/[,\s]+/).map(s=>s.trim()).filter(Boolean); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("복사했습니다"); }catch(e){ toast("복사가 막혔습니다. 길게 눌러 직접 복사하세요"); } }
function ask(html, okLabel, onOk){
  $("#dlgBox").innerHTML = html + `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="dlgNo">닫기</button>${okLabel?`<button class="btn pri" id="dlgOk">${esc(okLabel)}</button>`:""}</div>`;
  $("#dlg").classList.add("open");
  $("#dlgNo").onclick = ()=>$("#dlg").classList.remove("open");
  if(okLabel) $("#dlgOk").onclick = ()=>{ $("#dlg").classList.remove("open"); onOk&&onOk(); };
}

/* ===================== 판정 엔진 ===================== */
function evaluate(L, R, limitRow){
  R = R || S.rules;
  const reasons = [], warns = [], checks = [];
  const defectKw = kw(R.defects), watchKw = kw(R.watch);
  const active = (L.rights||[]).filter(r => r.active !== false && !/말소|해제|해지|취하|각하/.test(r.kind||""));

  // 1) 등기 하자
  const defects = active.filter(r => r.section==="갑구" || /임차권/.test(r.kind||""))
                        .filter(r => defectKw.some(k => (r.kind||"").includes(k) || (r.note||"").includes(k+"등기")));
  // 신탁은 비고/원인에만 있을 수 있음
  defects.forEach(r => reasons.push(`등기 하자: ${r.section} ${r.kind}${r.date?` (${r.date})`:""}`));
  const watched = active.filter(r => watchKw.some(k => (r.kind||"").includes(k)));
  watched.forEach(r => warns.push(`주의 등기: ${r.section} ${r.kind} — 내용 확인 필요`));

  // 2) 주택가격
  const mult = num(R.multipliers?.[typeGroup(L.type)] ?? 1) || 1;
  const price = num(L.priceOverride) || (num(L.publicPrice) * mult);
  const priceSrc = num(L.priceOverride) ? "직접 입력가" : `공시가격 × ${mult}`;

  // 3) 선순위 채권
  const liens = active.filter(r => r.section==="을구" && /근저당|저당|전세권|임차권|질권/.test(r.kind||""));
  const seniorDebt = liens.reduce((s,r)=>s+num(r.amount),0);
  const otherDep = num(L.otherDeposits);
  const deposit = num(L.deposit);
  const total = seniorDebt + otherDep + deposit;
  const ratio = price>0 ? total/price*100 : null;

  if(!price){ checks.push("공시가격(또는 주택가격)을 입력해야 부채비율을 계산할 수 있습니다."); }
  else if(ratio > num(R.threshold)) reasons.push(`부채비율 ${ratio.toFixed(1)}% > 기준 ${R.threshold}%`);
  else if(ratio > num(R.threshold) - num(R.margin)) warns.push(`부채비율 ${ratio.toFixed(1)}% — 기준(${R.threshold}%)까지 여유 ${(num(R.threshold)-ratio).toFixed(1)}%p`);

  // 4) 지원한도
  if(limitRow && num(limitRow.amount)>0 && deposit > num(limitRow.amount))
    reasons.push(`지원한도 초과: 보증금 ${man(deposit)} > ${limitRow.label} ${limitRow.region} ${man(limitRow.amount)}`);

  // 5) 집주인 동의
  if(L.consent==="no") reasons.push("집주인 LH 전세임대 거부");
  else if(L.consent!=="yes") warns.push("집주인 LH 동의 여부 미확인");

  // 6) 다가구
  if(L.type==="다가구" || L.type==="단독"){
    if(price && otherDep/price*100 >= num(R.multiOtherShare)) warns.push(`다른 호실 보증금 합계 ${man(otherDep)} (주택가격의 ${(otherDep/price*100).toFixed(0)}%)`);
    if(L.type==="다가구"){
      if(!L.fixedDateChecked) checks.push("확정일자 부여현황 확인 (주민센터·등기소, 임대인 동의 필요)");
      if(!L.tenantsChecked) checks.push("전입세대 열람 확인 (주민센터)");
      if(!L.fixedDateChecked || !L.tenantsChecked) warns.push("다가구 선순위 임차보증금 미확인");
      if(seniorDebt===0 && !otherDep) warns.push("근저당 0이지만 다른 호실 보증금이 0으로 입력됨 — 실제 확인 필요");
    }
  }

  // 7) 열람일 / 판독 확인
  const ds = daysSince(L.readDate);
  if(ds===null) warns.push("등기부 열람일 미입력");
  else if(ds > num(R.reReadDays)) warns.push(`등기부 열람 후 ${ds}일 경과 — 재열람 필요`);
  if((L.rights||[]).length && !L.rightsConfirmed) warns.push("자동 판독 결과를 중개사가 아직 확인하지 않음");
  if(!(L.rights||[]).length) warns.push("등기 권리 목록이 비어 있음 (등기부 미판독)");

  let light = "green";
  if(reasons.length) light = "red";
  else if(!price) light = "gray";
  else if(warns.length || checks.length) light = "yellow";

  return { light, reasons, warns, checks, ratio, price, priceSrc, seniorDebt, otherDep, deposit, total, defects, liens, mult };
}

async function pdfToTextAndImages(file, wantImages){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = ""; const images = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // 줄 단위 재구성
    // 글자 조각 사이 실제 간격을 보고 띄어쓰기 결정(글자마다 쪼개진 PDF 대응)
    let lastY=null, lastEnd=null, line="";
    for(const it of tc.items){
      if(!it.str) { if(it.hasEOL){ text += line.trim()+"\n"; line=""; lastEnd=null; } continue; }
      const x = it.transform[4], y = Math.round(it.transform[5]);
      const fh = Math.abs(it.transform[3]) || Math.abs(it.height) || 10;
      if(lastY!==null && Math.abs(y-lastY)>fh*0.5){ text += line.trim()+"\n"; line=""; lastEnd=null; }
      else if(lastEnd!==null){ const gap = x - lastEnd; if(gap > fh*0.22 && !/\s$/.test(line) && !/^\s/.test(it.str)) line += gap > fh*1.5 ? "   " : " "; }
      line += it.str; lastY=y; lastEnd = x + (it.width||0);
      if(it.hasEOL){ text += line.trim()+"\n"; line=""; lastEnd=null; }
    }
    text += line.trim()+"\n\n[페이지 "+p+" 끝]\n";
    if(wantImages && images.length<8){
      const vp = page.getViewport({scale:1.6});
      const c = document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
      images.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)));
    }
  }
  return { text, images, pages: pdf.numPages };
}

    catch(e){ bmp = await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>no(new Error("사진을 열 수 없습니다")); im.src=URL.createObjectURL(src); }); }
  }
  const W0=bmp.width, H0=bmp.height, long=Math.max(W0,H0);
  if(long < 1500) prepImage.lowRes = true;
  const sc = Math.max(0.5, Math.min(3, 2600/long));
  const W=Math.round(W0*sc), H=Math.round(H0*sc);
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d",{willReadFrequently:true}); g.imageSmoothingQuality="high";
  g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  const MODE = window.__prepMode || PREP_MODE;
  const ang = MODE==="A" ? 0 : estimateSkew(bmp);     // 기울기(도) 추정
  if(Math.abs(ang) > 0.15){ g.translate(W/2,H/2); g.rotate(-ang*Math.PI/180); g.translate(-W/2,-H/2); }
  g.drawImage(bmp,0,0,W,H); g.setTransform(1,0,0,1,0,0);
  prepImage.lastSkew = ang;
  const img=g.getImageData(0,0,W,H), d=img.data, n=W*H;
  const gray=new Float32Array(n);
  for(let i=0,j=0;i<n;i++,j+=4) gray[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
  // 적응형 임계값(Bradley): 주변 평균보다 15% 어두우면 글자
  const I=new Float64Array((W+1)*(H+1));
  for(let y=1;y<=H;y++){ let row=0; for(let x=1;x<=W;x++){ row+=gray[(y-1)*W+x-1]; I[y*(W+1)+x]=I[(y-1)*(W+1)+x]+row; } }
  const r=Math.max(12,Math.round(Math.min(W,H)/40)), bin=new Uint8Array(n), norm=new Uint8ClampedArray(n);
  for(let y=0;y<H;y++){ const y0=Math.max(0,y-r), y1=Math.min(H,y+r+1);
    for(let x=0;x<W;x++){ const x0=Math.max(0,x-r), x1=Math.min(W,x+r+1);
      const sum=I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0];
      const mean=sum/((x1-x0)*(y1-y0)); bin[y*W+x] = gray[y*W+x] < mean*0.85 ? 1 : 0;
      norm[y*W+x] = Math.max(0, Math.min(255, 255*gray[y*W+x]/Math.max(mean,1))); } }   // 그림자 평탄화(회색조 유지)
  // 표 선 지우기: 위아래(좌우) 1픽셀을 합쳐 본 뒤, 글자보다 훨씬 긴 가로·세로 줄을 흰색으로
  const minH=Math.round(W*0.06), minV=Math.round(H*0.025), kill=new Uint8Array(n);
  for(let y=0;y<H;y++){ let run=0; for(let x=0;x<=W;x++){
      const b = x<W && (bin[y*W+x] || (y>0&&bin[(y-1)*W+x]) || (y<H-1&&bin[(y+1)*W+x]));
      if(b) run++; else { if(run>=minH) for(let k=x-run;k<x;k++){ for(let dy=-2;dy<=2;dy++){ const yy=y+dy; if(yy>=0&&yy<H) kill[yy*W+k]=1; } } run=0; } } }
  for(let x=0;x<W;x++){ let run=0; for(let y=0;y<=H;y++){
      const b = y<H && (bin[y*W+x] || (x>0&&bin[y*W+x-1]) || (x<W-1&&bin[y*W+x+1]));
      if(b) run++; else { if(run>=minV) for(let k=y-run;k<y;k++){ for(let dx=-2;dx<=2;dx++){ const xx=x+dx; if(xx>=0&&xx<W) kill[k*W+xx]=1; } } run=0; } } }
  for(let i=0,j=0;i<n;i++,j+=4){ const v = kill[i] ? 255 : (MODE==="C" ? norm[i] : (bin[i]?0:255)); d[j]=d[j+1]=d[j+2]=v; d[j+3]=255; }
  g.putImageData(img,0,0);
  return c;
}
async function ocrImages(sources, onMsg){
  prepImage.lowRes = false;
  const w = await getOcr();
  let text="";
  for(let i=0;i<sources.length;i++){
    const base=i/sources.length, span=1/sources.length;
    onMsg(`사진 ${i+1}/${sources.length} 보정 중…`, base);
    const canvas = await prepImage(sources[i]);
    ocrProg = m=>{ if(m.status==="recognizing text") onMsg(`사진 ${i+1}/${sources.length} 글자 읽는 중… ${Math.round(m.progress*100)}%`, base+span*m.progress);
                   else if(/load|initializ/.test(m.status||"")) onMsg("글자 인식 엔진 준비 중… (처음 한 번 약 2MB 내려받기)", base); };
    const { data } = await w.recognize(canvas);
    text += data.text + "\n\n";
  }
  ocrProg=null;
  return text;
}
async function pdfPagesToCanvas(file, maxPages){
  const pdf = await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[]; const n=Math.min(pdf.numPages, maxPages);
  // 요약 페이지는 보통 마지막 쪽 → 뒤에서부터 읽기
  for(let p=pdf.numPages; p>pdf.numPages-n; p--){
    const page=await pdf.getPage(p); const v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale: Math.min(4, (window.__pdfTarget||2600)/Math.max(v1.width, v1.height))});
    const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise; out.unshift(c);
  }
  return out;
}

async function runParse(){
  const L = S.edit; if(!L || !S.editFiles.length || S.parsing) return;
  S.parsing=true; S.parseErr=false; S.parseProg=0; S.parseMsg="등기부를 읽는 중…"; renderEditor();
  try{
    let text="", ocrSources=[];
    for(const f of S.editFiles){
      if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
        if(!window.pdfjsLib) throw new Error("PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.");
        const r = await pdfToTextAndImages(f, false);
        if(r.text.replace(/\s|\[페이지 \d+ 끝\]/g,"").length >= 200) text += r.text;
        else { setParseMsg("스캔 PDF입니다. 페이지를 이미지로 바꾸는 중…", 0); ocrSources.push(...await pdfPagesToCanvas(f, 8)); }
      } else if(/^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)){
        ocrSources.push(f);
      }
    }
    let usedOcr=false;
    if(ocrSources.length){
      usedOcr=true;
      text += await ocrImages(ocrSources, (msg,p)=>{ if(S.edit===L) setParseMsg(msg,p); });
    }
    if(text.replace(/\s/g,"").length < 100) throw new Error("글자를 거의 읽지 못했습니다. 등기부가 화면에 꽉 차게, 흔들림 없이 밝은 곳에서 다시 찍어주세요.");
    const res = ruleParse(text, { ocr: usedOcr });
    if(usedOcr && prepImage.lowRes) res.warnings.push("사진 해상도가 낮습니다. 휴대폰 기본 카메라로 등기부가 화면에 꽉 차게 다시 찍으면 더 정확합니다.");
    if(usedOcr && !res.rights.length && !/주요\s*등기\s*사항\s*요약|사\s*항\s*[없업]\s*[음옴]/.test(ocrNormalize(text)))
      res.warnings.push("등기부 내용을 거의 찾지 못했습니다. 마지막 장 '주요 등기사항 요약' 페이지를 밝은 곳에서 정면으로 찍어주세요.");
    applyParse(L, res, usedOcr ? "사진 인식" : "자동");
    if(res.kindHint==="집합건물" && !L.type) L.type="연립다세대";
    L.ocrText = usedOcr ? text.slice(0,20000) : undefined;
    S.parseMsg = `${usedOcr?"사진 인식":"판독"} 완료 — 권리 ${L.rights.length}건. 아래 표를 원본과 대조해 고친 뒤 '확인 완료'에 체크하세요.`;
  }catch(e){ S.parseErr=true; S.parseMsg = "판독 실패: "+(e.message||e); }
  S.parsing=false; S.parseProg=null; renderEditor();
  if(!S.parseErr && S.edit===L && !num(L.priceOverride)) runPrice();
}
function applyParse(L, r, via){
  if(!r || typeof r!=="object") throw new Error("판독 결과 형식 오류");
  if(r.readDate) L.readDate = r.readDate;
  if(r.address && !L.address) L.address = r.address;
  if(r.address && !L.name) L.name = r.address.split(" ").slice(-3).join(" ");
  if(r.buildingType && TYPES.includes(r.buildingType) && (!L.type || L._typeAuto)) { L.type = r.buildingType; L._typeAuto=true; }
  if(r.area && !L.area) L.area = r.area;
  if(r.jibunAddress) L.jibun = r.jibunAddress;
  if(r.dongNm && !L.dongNm) L.dongNm = String(r.dongNm);
  if(r.hoNm && !L.hoNm) L.hoNm = String(r.hoNm);
  if(r.complexName && !L.complexName) L.complexName = r.complexName;
  if(r.owner) L.owner = r.owner;
  if(!L.region) L.region = regionOf(L.address);
  L.rights = (r.rights||[]).map(x=>({
    section: SECTIONS.includes(x.section)?x.section:(/근저당|전세|임차/.test(x.kind||"")?"을구":"갑구"),
    rank: String(x.rank??""), kind: String(x.kind??""), date: String(x.date??""), holder: String(x.holder??""),
    amount: x.amount==null ? "" : num(x.amount), active: x.active!==false, note: String(x.note??"")
  }));
  L.parseWarnings = (r.warnings||[]).map(String);
  L.parsedVia = via; L.parsedAt = new Date().toISOString();
  L.rightsConfirmed = false;
}

/* ===================== 공시가격 자동 조회 (Supabase → VWorld) ===================== */
const SB_SERVER = "Supabase", SB_PROJECT = "dwtylilyvmvbpsryvlcg";
const sqlStr = s => "'" + String(s ?? "").replace(/'/g,"''") + "'";
function jibunOf(addr){
  const a = String(addr||"").replace(/\s+/g," ").trim();
  const m = a.match(/^(.*?\S+(?:동|리|가)\d*\s+(?:산\s*)?\d+(?:-\d+)?)(?=\s|$|,)/);
  return m ? m[1] : a;
}
function dongHoOf(addr){
  const a = String(addr||""); const rest = a.slice(jibunOf(a).length);
  const d = rest.match(/제?\s*([0-9A-Za-z가-하]{1,4})\s*동(?![가-힣])/);
  const h = rest.match(/제?\s*(B?\d{1,5}|지하\s*\d+)\s*호/);
  return { dong: d?d[1].replace(/^제/,""):"", ho: h?h[1].replace(/\s/g,""):"" };
}
function priceKind(type){ return (type==="아파트"||type==="연립다세대") ? "apart" : (type==="다가구"||type==="단독") ? "house" : "auto"; }

/* L에 공시가격을 채운다. 반환: {ok, msg, choices?} */
async function fetchPublicPrice(L, opt={}){
  if(L.type==="오피스텔") return { ok:false, msg:"오피스텔은 주택 공시가격 대상이 아닙니다. 국세청 기준시가·감정가를 직접 입력하세요." };
  const src = L.jibun || L.address;
  if(!src) return { ok:false, msg:"소재지(지번주소)를 먼저 입력하세요." };
  const jib = L.jibun || jibunOf(L.address);
  const dh = dongHoOf(L.address);
  const dong = opt.dong ?? (L.dongNm || dh.dong), ho = L.hoNm || dh.ho;
  const kind = priceKind(L.type);
  let r;
  try{ r = await rpc("lh_price",{ p_token:S.token, p_jibun:jib, p_dong:dong, p_ho:ho, p_kind:kind }); }catch(e){ return { ok:false, msg: e.message }; }
  if(!r) return { ok:false, msg:"응답이 비어 있습니다." };
  if(r.ok && r.price_won){
    L.publicPrice = Math.round(r.price_won/10000);
    L.priceInfo = { kind:r.kind, year:r.year, pnu:r.pnu, address:r.address, at:new Date().toISOString(), won:r.price_won };
    if(opt.dong) L.dongNm = opt.dong;
    return { ok:true, msg:`${r.year}년 ${r.kind} ${man(L.publicPrice)} 자동 입력 (${r.address||""})` };
  }
  if(r.code==="NO_KEY") return { ok:false, noKey:true, msg:"공시가격 조회 서버 설정이 아직 끝나지 않았습니다. 관리자에게 문의하세요." };
  if(r.code==="AMBIGUOUS") return { ok:false, msg:r.message, choices:r.choices||[] };
  return { ok:false, msg: r.message || "공시가격을 찾지 못했습니다." };
}

async function bulkPrice(){

  const targets = S.listings.filter(L => L.type!=="오피스텔" && (L.jibun||L.address) && !num(L.priceOverride));

  S.bulk = { done:0, total:targets.length, ok:0, fail:[] }; renderListOnly();
  for(const L0 of targets){
    const L = structuredClone(L0);
    const r = await fetchPublicPrice(L);

}

  $("#fLimit").onchange=e=>{ F.limitIdx=+e.target.value; const l=currentLimit(); if(l && l.amount) F.maxDeposit = String(l.amount); renderList(); };
  $("#fRegion").onchange=e=>{ F.region=e.target.value; renderList(); };
  $("#fToggle").onclick=()=>{ S.filterOpen=!S.filterOpen; renderList(); };
  if($("#fReset")) $("#fReset").onclick=()=>{ F.limitIdx=-1; F.region=""; F.maxDeposit=""; renderList(); };
  $("#fMax").oninput=e=>{ F.maxDeposit=e.target.value; clearTimeout(renderList._t); renderList._t=setTimeout(()=>{ renderList(); const el=$("#fMax"); el.focus(); el.setSelectionRange?.(el.value.length,el.value.length); },400); };
  $("#fQ").oninput=e=>{ F.q=e.target.value; clearTimeout(renderList._q); renderList._q=setTimeout(()=>{ renderList(); const el=$("#fQ"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); },400); };
  document.querySelectorAll("[data-light]").forEach(b=>b.onclick=()=>{ const k=b.dataset.light; F.lights.has(k)?F.lights.delete(k):F.lights.add(k); renderList(); });
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openEditor(el.dataset.open));
  $("#shareBtn").onclick=()=>openShare(greens.map(r=>r.L));
  if($("#bulkBtn")) $("#bulkBtn").onclick=bulkPrice;
}
function itemCard(L,E){
  const why = E.light==="green" ? `<span class="tag green">부채비율 ${E.ratio.toFixed(1)}%</span>` :
    [...E.reasons.slice(0,2).map(r=>`<span class="tag red">${esc(r)}</span>`), ...E.warns.slice(0, E.reasons.length?1:2).map(r=>`<span class="tag yellow">${esc(r)}</span>`), ...(E.light==="gray"?[`<span class="tag">공시가격 미입력</span>`]:[]),
     ...((E.reasons.length+E.warns.length) > (Math.min(2,E.reasons.length)+(E.reasons.length?Math.min(1,E.warns.length):Math.min(2,E.warns.length))) ? [`<span class="tag">외 ${(E.reasons.length+E.warns.length)-(Math.min(2,E.reasons.length)+(E.reasons.length?Math.min(1,E.warns.length):Math.min(2,E.warns.length)))}건</span>`]:[])].join(" ");
  const ds = daysSince(L.readDate);
  return `<div class="card item" data-open="${esc(L.id)}">
    <div class="light ${E.light}"><i></i><i></i><i></i></div>
    <div style="flex:1;min-width:0">

    </div>

}

function verdictHTML(E){
  return `<div class="light ${E.light==="gray"?"":E.light}"><i></i><i></i><i></i></div>
  <div style="flex:1">

      = <b>${E.ratio!=null?E.ratio.toFixed(1)+"%":"계산 불가"}</b> (기준 ${esc(S.rules.threshold)}% 이하)</div>
    ${E.reasons.length?`<ul>${E.reasons.map(r=>`<li style="color:var(--r)"><b>${esc(r)}</b></li>`).join("")}</ul>`:""}
    ${E.warns.length?`<ul>${E.warns.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
    ${E.checks.length?`<div class="req"><b>확인 요청 항목</b><ul style="margin:4px 0 0;padding-left:18px">${E.checks.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`:""}
  </div>`;
}
function refreshVerdict(){
  const E = evaluate(S.edit, S.rules, currentLimit());
  const v = $("#verdict"); if(!v) return;
  v.className = "verdict "+E.light; v.innerHTML = verdictHTML(E);
}
function bindEditor(){
  const L=S.edit;
  $("#eClose").onclick=closeEditor; if($("#eCancel")) $("#eCancel").onclick=closeEditor;
  const drop=$("#drop"), file=$("#file"), fileImg=$("#fileImg");
  $("#pickPdf").onclick=()=>file.click(); $("#pickImg").onclick=()=>fileImg.click();
  file.onchange=()=>{ S.editFiles=[...file.files]; S.parseMsg=""; renderEditor(); if(S.editFiles.length) runParse(); };
  fileImg.onchange=()=>{ S.editFiles=[...fileImg.files]; S.parseMsg=""; renderEditor(); if(S.editFiles.length) runParse(); };
  drop.ondragover=e=>{e.preventDefault(); drop.classList.add("hot");};
  drop.ondragleave=()=>drop.classList.remove("hot");
  drop.ondrop=e=>{ e.preventDefault(); S.editFiles=[...e.dataTransfer.files].filter(f=>/pdf|image/.test(f.type)); renderEditor(); };
  $("#parseBtn").onclick=runParse;
  if($("#priceBtn")) $("#priceBtn").onclick=()=>runPrice();
  $("#sheet").querySelectorAll("[data-pickdong]").forEach(b=>b.onclick=()=>runPrice({dong:b.dataset.pickdong}));
  $("#sheet").querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    const h=()=>{
      L[k] = el.type==="checkbox" ? el.checked : el.value;
      if(el.dataset.money && el.nextElementSibling) el.nextElementSibling.textContent = num(el.value)?"= "+man(el.value):"";
      if(k==="type") L._typeAuto=false;
      if(k==="type") { renderEditor(); return; }
      refreshVerdict();
    };
    el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"||el.type==="date"?"change":"input", h);
  });
  $("#sheet").querySelectorAll("[data-r]").forEach(el=>{
    const i=+el.dataset.r, f=el.dataset.f;
    const h=()=>{
      const r=L.rights[i]; r[f] = el.type==="checkbox" ? el.checked : (f==="amount" ? (el.value===""?"":num(el.value)) : el.value);
      L.rightsConfirmed=false;
      if(el.type==="checkbox"||el.tagName==="SELECT") renderEditor(); else refreshVerdict();
    };
    el.addEventListener(el.type==="checkbox"||el.tagName==="SELECT"?"change":"input", h);
    if(el.type!=="checkbox"&&el.tagName!=="SELECT") el.addEventListener("change",()=>renderEditor());
  });
  $("#sheet").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ L.rights.splice(+b.dataset.del,1); L.rightsConfirmed=false; renderEditor(); });
  $("#addRow").onclick=()=>{ L.rights.push({section:"을구",rank:"",kind:"근저당권설정",date:"",holder:"",amount:"",active:true,note:"직접 입력"}); renderEditor(); };
  $("#eSave").onclick=async()=>{
    if(!L.name && !L.address){ toast("매물 이름이나 소재지를 입력하세요"); return; }
    if(!L.region) L.region = regionOf(L.address);
    const copy = structuredClone(L); delete copy._typeAuto;
    if(history.state && history.state.sheet){ S.edit=null; history.back(); } hideSheet();
    await saveListing(copy); toast("저장했습니다");
    // 공시가격이 비어 있으면 저장 후 자동 조회
    if(S.token && !num(copy.publicPrice) && !num(copy.priceOverride) && copy.type!=="오피스텔" && (copy.jibun||copy.address)){
      const c2 = structuredClone(copy); const r = await fetchPublicPrice(c2);
      if(r.ok){ await saveListing(c2); toast("공시가격 자동 입력: "+man(c2.publicPrice)); } else toast("공시가격 자동 조회 실패: "+r.msg);
    }
  };
  if($("#eDel")) $("#eDel").onclick=()=>ask(`<b>이 매물을 삭제할까요?</b><div class="muted">${esc(L.name||L.address)}</div>`,"삭제",async()=>{ const id=L.id; if(history.state && history.state.sheet){ S.edit=null; history.back(); } hideSheet(); await deleteListing(id); toast("삭제했습니다"); });
}

/* ===================== 화면: 규칙 ===================== */
function renderRules(){

    <label class="f" style="margin-top:8px">다가구: 다른 호실 보증금이 주택가격의 몇 % 이상이면 노랑<input type="number" data-rk="multiOtherShare" value="${esc(R.multiOtherShare)}"></label>

      <label class="f">연락처<input type="text" data-of="phone" value="${esc(R.office?.phone)}" placeholder="02-000-0000"></label>

  document.querySelectorAll("[data-mul]").forEach(el=>el.oninput=()=>{ R.multipliers = R.multipliers||{}; R.multipliers[el.dataset.mul]=num(el.value)||1; });

  $("#saveRules").onclick=saveRules;
  $("#resetRules").onclick=()=>ask("<b>규칙을 기본값으로 되돌릴까요?</b><div class='muted'>저장을 눌러야 반영됩니다.</div>","되돌리기",()=>{ S.rules=structuredClone(DEFAULT_RULES); renderRules(); });
  $("#exportBtn").onclick=()=>{ const t=JSON.stringify({listings:S.listings,rules:S.rules},null,1); ask(`<b>매물장 백업</b><pre class="copy">${esc(t.slice(0,3000))}${t.length>3000?"\n…":""}</pre>`,"전체 복사",()=>copyText(t)); };
  $("#importBtn").onclick=()=>{
    ask(`<b>JSON 붙여넣기</b><textarea id="impTxt" style="min-height:140px;margin-top:8px"></textarea>`,"가져오기",async()=>{
      try{ const j=JSON.parse($("#impTxt").value); for(const L of (j.listings||[])){ if(!L.id) L.id=uid(); await saveListing(L); } toast("가져왔습니다"); }catch(e){ toast("JSON 형식 오류"); }
    });
  };
}

/* ===================== 고객용 공유 ===================== */
function shareText(items, title){
  const o=S.rules.office||{};
  return `[${title}]\nLH 전세임대 사전점검 '초록' 매물 ${items.length}건\n\n` +
    items.map((L,i)=>`${i+1}. ${L.name||L.address}\n   ${L.type||""} · ${L.area?L.area+"㎡ · ":""}전세 ${man(L.deposit)}${L.publicNote?`\n   ${L.publicNote}`:""}`).join("\n") +
    `\n\n※ 사전 점검 결과이며 최종 승인은 LH 권리조사·감정평가가 결정합니다.` + (o.name||o.phone?`\n문의: ${o.name||""} ${o.phone||""}`:"");
}
function openShare(items){
  const title = (S.filter.limitIdx>=0 ? `${S.rules.limits[S.filter.limitIdx].label} ${S.rules.limits[S.filter.limitIdx].region} ` : "") + "추천 매물";
  const txt = shareText(items, title);
  ask(`<b>고객에게 보내기 — 초록 ${items.length}건</b>
    <div class="muted" style="margin:6px 0">고객용 링크를 만들면 로그인 없이 누구나 볼 수 있는 목록 화면이 생깁니다(90일 유지). 소유자·권리 정보는 들어가지 않습니다.</div>
    <pre class="copy">${esc(txt)}</pre>
    <div class="row"><button class="btn pri" id="mkLink">고객용 링크 만들기</button><button class="btn" id="cpTxt">문구만 복사</button></div>
    <div id="linkOut" style="margin-top:8px"></div>`, null);
  $("#cpTxt").onclick=()=>copyText(txt);
  $("#mkLink").onclick=async()=>{
    $("#mkLink").disabled=true;
    const doc = { title, office:S.rules.office||{}, items: items.map(L=>({
      name:L.name||"", address:(L.address||"").replace(/\s*(제?\s*\S+동\s*)?제?\s*\d+\s*호.*$/,"").replace(/\s*제\d+층.*$/,""), type:L.type||"", area:L.area||"", deposit:num(L.deposit), publicNote:L.publicNote||"", readDate:L.readDate||"" })) };
    try{
      const r = await rpc("lh_share_create",{p_token:S.token,p_data:doc});
      const url = `${location.origin}${location.pathname}?s=${r.id}`;
      const full = txt + "\n\n▶ 매물 보기: " + url;
      $("#linkOut").innerHTML = `<div class="req"><b>링크가 만들어졌습니다</b><div style="word-break:break-all;margin:4px 0">${esc(url)}</div>
        <div class="row"><button class="btn sm pri" id="cpFull">문구+링크 복사</button><button class="btn sm" id="cpUrl">링크만 복사</button><a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">미리보기 ↗</a></div></div>`;
      $("#cpFull").onclick=()=>copyText(full); $("#cpUrl").onclick=()=>copyText(url);
    }catch(e){ toast("링크 생성 실패: "+e.message); $("#mkLink").disabled=false; }
  };
}
async function loadCustomer(id){
  S.cust = { id, loading:true }; renderCustomer();
  try{
    const d = await rpc("lh_share_get",{p_id:id});
    S.cust = d ? { id, data:d } : { id, error:"만료되었거나 없는 링크입니다." };
  }catch(e){ S.cust={id,error:"불러오지 못했습니다: "+e.message}; }
  renderCustomer();
}
function renderCustomer(){
  const C=S.cust, d=C.data;
  document.body.classList.add("cust");
  $("#app").innerHTML = `<header><h1>${esc(d?.title||"추천 매물")}</h1><div class="sub">LH 전세임대 사전점검 '초록' 매물${d?.office?.name?` · ${esc(d.office.name)}`:""}</div></header>
  <div class="notice">⚠ 사전 점검 결과입니다. 최종 승인은 LH 권리조사·감정평가가 결정합니다.</div>
  <main>
    ${C.loading?`<div class="empty"><span class="spin"></span>불러오는 중…</div>`:C.error?`<div class="empty">${esc(C.error)}</div>`:
    `<div class="list">${(d.items||[]).map(it=>`<div class="card item"><div class="light green"><i></i><i></i><i></i></div><div style="flex:1">
      <div class="t">${esc(it.name||it.address)}</div>
      <div class="m">${esc(it.address)}</div>
      <div class="m">${esc(it.type)}${it.area?` · ${esc(it.area)}㎡`:""} · 전세 <b>${man(it.deposit)}</b></div>
      ${it.publicNote?`<div class="why">${esc(it.publicNote)}</div>`:""}
      <div class="muted">등기 열람일 ${esc(it.readDate||"-")} · 계약 전 재확인 예정</div></div></div>`).join("")}</div>
    ${(d.office?.name||d.office?.phone)?`<div class="card" style="margin-top:12px"><b>문의</b> ${esc(d.office.name||"")} ${d.office.phone?`<a href="tel:${esc(String(d.office.phone).replace(/[^0-9]/g,""))}">${esc(d.office.phone)}</a>`:""}</div>`:""}`}
  </main>`;
}

/* ===================== 로그인 ===================== */
function renderLogin(mode){
  mode = mode || S.loginMode || "login"; S.loginMode = mode;
  $("#app").innerHTML = `<header><h1>LH 전세임대 사전점검 신호등</h1><div class="sub">중개사무소 앱 ⑤ · 중개사 전용</div></header>
  <div class="notice">⚠ 사전 점검용 도구입니다. 최종 승인은 LH 권리조사·감정평가가 결정합니다.</div>
  <main style="max-width:440px">
    <div class="card">
      <div class="chips" style="margin-bottom:12px"><button class="chip ${mode==="login"?"on":""}" data-mode="login">로그인</button><button class="chip ${mode==="signup"?"on":""}" data-mode="signup">처음이에요 (가입)</button></div>
      <form id="authForm">
        ${mode==="signup"?`
        <label class="f">이름<input type="text" name="name" autocomplete="name" required></label>
        <label class="f" style="margin-top:8px">중개사무소 이름<input type="text" name="office" required placeholder="○○공인중개사사무소"></label>
        <label class="f" style="margin-top:8px">중개사무소 등록번호<input type="text" name="reg" required placeholder="예: 11620-2020-00123"></label>`:""}
        <label class="f" style="margin-top:8px">휴대폰 번호<input type="tel" name="phone" autocomplete="tel" required placeholder="010-0000-0000"></label>
        <label class="f" style="margin-top:8px">비밀번호 (숫자 6~8자리)<input type="password" name="pin" inputmode="numeric" autocomplete="${mode==="signup"?"new-password":"current-password"}" required></label>
        ${mode==="signup"?`<label class="f" style="margin-top:8px">비밀번호 확인<input type="password" name="pin2" inputmode="numeric" required></label>
        <div class="muted" style="margin-top:8px">매물장은 본인만 볼 수 있습니다. 등록번호는 중개사 확인용으로만 씁니다.</div>`:""}
        <div id="authErr" class="status err"></div>
        <button class="btn pri" type="submit" style="width:100%;margin-top:12px;padding:11px">${mode==="signup"?"가입하고 시작하기":"로그인"}</button>
      </form>
    </div>
    <div class="muted" style="margin-top:12px;text-align:center"><a href="./">← 중개사무소 앱 홈</a></div>
  </main>`;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>renderLogin(b.dataset.mode));
  $("#authForm").onsubmit=async e=>{
    e.preventDefault(); const f=new FormData(e.target), err=$("#authErr"); err.textContent="";
    const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
    try{
      let r;
      if(mode==="signup"){
        if(f.get("pin")!==f.get("pin2")) throw new Error("비밀번호 확인이 다릅니다");
        r = await rpc("lh_signup",{p_name:f.get("name"),p_phone:f.get("phone"),p_office:f.get("office"),p_reg_no:f.get("reg"),p_pin:f.get("pin")});
      } else {
        r = await rpc("lh_login",{p_phone:f.get("phone"),p_pin:f.get("pin")});
      }
      if(r && r.error) throw new Error(r.error);
      setToken(r.token); S.me=r.member; initStore();
    }catch(ex){ err.textContent = ex.message; btn.disabled=false; }
  };
}
async function logout(){ try{ await rpc("lh_logout",{p_token:S.token}); }catch(e){} setToken(""); S.me=null; S.listings=[]; renderLogin("login"); }

/* ===================== 시작 ===================== */
(function start(){
  const sid = new URLSearchParams(location.search).get("s");
  if(sid && /^[a-f0-9]{8,40}$/.test(sid)){ loadCustomer(sid); return; }
  S.token = getToken();
  if(!S.token){ renderLogin("login"); return; }
  initStore();
})();

window.__evaluate = evaluate; window.__ruleParse = ruleParse;
