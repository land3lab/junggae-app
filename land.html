<style>

input:focus,select:focus,textarea:focus{outline:2px solid #F9B48F;border-color:var(--brand)}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}

.bar{position:sticky;bottom:0;background:rgba(246,245,241,.96);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap}

<script>
(function(){
"use strict";
const SB_URL="https://dwtylilyvmvbpsryvlcg.supabase.co", SB_KEY="sb_publishable_Vht7Hh-4GF-mpbnprPp3FQ_AgGPTKTH", TK="junggae-token";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
function token(){try{return localStorage.getItem(TK)||''}catch(e){return''}}
async function rpc(fn,args){
  let r;try{r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})}catch(e){throw new Error('인터넷 연결을 확인하세요')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||('서버 오류 '+r.status);if(m==='AUTH_REQUIRED'){try{localStorage.removeItem(TK)}catch(e){}S.me=null;render();throw new Error('로그인이 만료됐어요. 다시 로그인하세요')}throw new Error(m)}
  return j}

/* ---------- 숫자 표기 ---------- */
const PY=0.3025;
function won(v){if(v==null||!isFinite(v))return'-';v=Math.round(v);const eok=Math.floor(v/1e8),man=Math.round((v%1e8)/1e4);
  if(eok>0)return eok+'억'+(man?' '+man.toLocaleString()+'만':'')+'원';return man.toLocaleString()+'만원'}
function wonShort(v){if(v==null||!isFinite(v))return'-';if(v>=1e8){const x=v/1e8;return(x>=10?x.toFixed(1):x.toFixed(2)).replace(/\.?0+$/,'')+'억'}return Math.round(v/1e4).toLocaleString()+'만'}
const perPy=v=>v/PY; // 원/㎡ → 원/평
const fmtM2=v=>Math.round(v).toLocaleString()+'원/㎡';
const fmtPy=v=>wonShort(perPy(v))+'원/평';
function quant(a,q){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const p=(s.length-1)*q,b=Math.floor(p),r=p-b;return s[b+1]!==undefined?s[b]+r*(s[b+1]-s[b]):s[b]}
const normUse=s=>String(s||'').replace(/지역$/,'').replace(/\s/g,'');
const ymdList=(n)=>{const d=new Date();const out=[];for(let i=0;i<n;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+String(x.getMonth()+1).padStart(2,'0'))}return out};

/* ---------- 상태 ---------- */
const S={me:null,step:'input',addr:LS.get('sise.lastAddr',''),land:null,trades:null,tradeSrc:'',noKey:false,
  opt:LS.get('sise.opt',{months:36,scope:'dong',jimok:true,use:false,share:false,lo:1.3,hi:1.8}),
  office:LS.get('sise.office',{}),ment:{seller:'',buyer:''},busy:false,progress:0};

/* ---------- 화면 ---------- */
function render(){
  const tk=token();
  if(!tk){renderLogin();return}
  const A=$('#app');
  A.innerHTML=`
  <div class="card">
    <h2><span class="n">1</span>대상 토지 주소</h2>
    <p class="desc">지번 주소를 넣으세요. 토지특성(지목·면적·용도지역)과 개별공시지가 이력을 자동으로 가져옵니다.</p>
    <label class="f">지번 주소<input type="text" id="addr" placeholder="예: 양주시 백석읍 가업리 산 1 / 관악구 봉천동 100-1" value="${esc(S.addr)}" enterkeyhint="search"></label>
    <details style="margin-top:8px"><summary class="hint" style="min-height:44px;display:flex;align-items:center;cursor:pointer">비교 조건 바꾸기</summary>
      <div class="grid" style="margin-top:6px">
        <label class="f">비교 기간<select id="o-months">${[12,24,36].map(m=>`<option value="${m}" ${S.opt.months==m?'selected':''}>최근 ${m/12}년(${m}개월)</option>`).join('')}</select></label>
        <label class="f">비교 범위<select id="o-scope"><option value="dong" ${S.opt.scope==='dong'?'selected':''}>같은 동·리</option><option value="sgg" ${S.opt.scope==='sgg'?'selected':''}>같은 시·군·구 전체</option></select></label>
        <label class="chk"><input type="checkbox" id="o-jimok" ${S.opt.jimok?'checked':''}>같은 지목만</label>
        <label class="chk"><input type="checkbox" id="o-use" ${S.opt.use?'checked':''}>같은 용도지역만</label>
        <label class="chk full"><input type="checkbox" id="o-share" ${S.opt.share?'checked':''}>지분거래도 포함(기본은 제외)</label>
      </div>
    </details>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="go" style="flex:1" ${S.busy?'disabled':''}>🔎 시세 범위 계산</button></div>
    <div id="msg"></div>
  </div>
  <div id="result"></div>
  <p class="hint" style="text-align:center">로그인: ${esc(S.me?.office||'')} ${esc(S.me?.name||'')} · <a href="#" id="logout" style="color:var(--sub)">로그아웃</a></p>`;
  $('#go').onclick=run;
  $('#addr').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  ['months','scope'].forEach(k=>$('#o-'+k).onchange=e=>{S.opt[k]=k==='months'?+e.target.value:e.target.value;LS.set('sise.opt',S.opt);if(S.land)recompute()});
  ['jimok','use','share'].forEach(k=>$('#o-'+k).onchange=e=>{S.opt[k]=e.target.checked;LS.set('sise.opt',S.opt);if(S.trades)renderResult()});
  $('#logout').onclick=e=>{e.preventDefault();try{localStorage.removeItem(TK)}catch(_){}S.me=null;render()};
  if(S.land)renderResult();
}
function renderLogin(){
  $('#app').innerHTML=`<div class="card"><h2>로그인</h2>
  <p class="desc">중개사무소 앱 회원 전용입니다(⑤ LH 신호등과 같은 계정). 공공데이터 조회 한도를 지키기 위해 로그인이 필요해요.</p>
  <div class="grid"><label class="f">휴대폰 번호<input type="tel" id="ph" inputmode="numeric" placeholder="01012345678"></label>
  <label class="f">숫자 비밀번호<input type="password" id="pin" inputmode="numeric" placeholder="6~8자리"></label></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="lg" style="flex:1">로그인</button>
  <a class="btn" href="lh.html" target="_top" style="text-decoration:none;display:inline-flex;align-items:center">처음이면 가입하기</a></div><div id="lmsg"></div></div>`;
  const go=async()=>{try{const j=await rpc('lh_login',{p_phone:$('#ph').value,p_pin:$('#pin').value});if(j.error){$('#lmsg').innerHTML='<div class="note r">'+esc(j.error)+'</div>';return}
    localStorage.setItem(TK,j.token);S.me=j.member;render()}catch(e){$('#lmsg').innerHTML='<div class="note r">'+esc(e.message)+'</div>'}};
  $('#lg').onclick=go;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

/* ---------- 조회 ---------- */
async function run(addrOrPnu){
  const q=(typeof addrOrPnu==='string'?addrOrPnu:$('#addr').value).trim();
  if(!q){$('#msg').innerHTML='<div class="note y">주소를 넣어 주세요.</div>';return}
  if(typeof addrOrPnu!=='string'){S.addr=q;LS.set('sise.lastAddr',q)}
  S.busy=true;$('#go').disabled=true;$('#msg').innerHTML='<div class="note b">토지 정보 가져오는 중…</div>';$('#result').innerHTML='';
  try{
    const j=await rpc('sise_land',{p_token:token(),p_addr:q});
    if(!j.ok){$('#msg').innerHTML='<div class="note r">'+esc(j.message)+'</div>';return}
    S.land=j;
    // 입력한 번지와 다른 필지가 잡혔으면 고르게 함
    const typed=(q.match(/(산\s*)?\d+(-\d+)?\s*$/)||[''])[0].replace(/\s/g,'');
    const got=String(j.address||'').replace(/\s/g,'');
    let pick='';
    if(typed&&!/^\d{19}$/.test(q)&&!got.endsWith(typed)&&(j.choices||[]).length){
      pick='<div class="note y">입력한 번지(<b>'+esc(typed)+'</b>)와 다른 필지가 먼저 잡혔어요: <b>'+esc(j.address)+'</b>. 맞는 필지를 고르세요.'+
        j.choices.map(c=>'<button class="btn sm choice" data-pnu="'+esc(c.pnu)+'">'+esc(c.address)+'</button>').join('')+'</div>';
    }
    $('#msg').innerHTML=pick;
    $$('#msg [data-pnu]').forEach(b=>b.onclick=()=>run(b.dataset.pnu));
    if(!j.land){$('#msg').innerHTML+='<div class="note r">이 필지의 토지특성 자료가 없어요(신규 분할·행정구역 변경 등). 공시지가 이력만 표시합니다.</div>'}
    await recompute();
  }catch(e){$('#msg').innerHTML='<div class="note r">'+esc(e.message)+'</div>'}
  finally{S.busy=false;const g=$('#go');if(g)g.disabled=false}
}
async function recompute(){
  S.trades=null;S.noKey=false;
  const lawd=S.land.pnu.slice(0,5);const months=ymdList(S.opt.months);
  $('#result').innerHTML='<div class="card"><b>실거래 사례 모으는 중…</b> <span class="hint" id="pc">0/'+months.length+'개월</span><div class="prog"><i id="pb"></i></div></div>';
  const all=[];let done=0,fail=0,noKey=false,lastErr='';
  const queue=[...months];
  async function worker(){while(queue.length){const ym=queue.shift();
    try{const r=await rpc('sise_trades',{p_token:token(),p_lawd:lawd,p_ymd:ym});
      if(r.ok)(r.items||[]).forEach(x=>all.push(x));else{if(r.code==='NO_KEY'){noKey=true;queue.length=0}else{fail++;lastErr=r.message}}}
    catch(e){fail++;lastErr=e.message}
    done++;const pb=$('#pb'),pc=$('#pc');if(pb)pb.style.width=(done/months.length*100)+'%';if(pc)pc.textContent=done+'/'+months.length+'개월'}}
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.noKey=noKey;
  if(!noKey){S.trades=all.map(x=>({dong:x.dong||'',jibun:x.jibun||'',jimok:x.jimok||'',use:x.use||'',area:+x.area||0,amount:+x.amount||0,ymd:(x.y||'')+'.'+String(x.m||'').padStart(2,'0')+(x.d?'.'+String(x.d).padStart(2,'0'):''),share:x.share||'',cancel:x.cancel||''}));
    S.tradeSrc='국토교통부 실거래가 공개(토지 매매), 최근 '+S.opt.months+'개월'+(fail?` · ${fail}개월 조회 실패(${lastErr})`:'')}
  renderResult();
}

/* ---------- CSV(국토부 실거래가 공개시스템 다운로드) ---------- */
async function readCsv(file){
  const buf=await file.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('�')||!/시군구/.test(txt)){try{txt=new TextDecoder('euc-kr').decode(buf)}catch(e){}}
  const lines=txt.split(/\r?\n/);const hi=lines.findIndex(l=>/시군구/.test(l)&&/거래금액/.test(l));
  if(hi<0)throw new Error('토지 매매 실거래 CSV가 아닌 것 같아요(시군구·거래금액 열이 없음)');
  const parse=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const h=parse(lines[hi]);const col=re=>h.findIndex(x=>re.test(x));
  const c={sgg:col(/시군구/),jibun:col(/번지/),jimok:col(/지목/),use:col(/용도지역/),area:col(/(계약|거래)면적/),amt:col(/거래금액/),ym:col(/계약년월/),d:col(/계약일/),share:col(/지분/),cancel:col(/해제/)};
  const rows=[];
  for(const l of lines.slice(hi+1)){if(!l.trim())continue;const r=parse(l);if(r.length<4)continue;
    const ym=String(r[c.ym]||'');rows.push({dong:r[c.sgg]||'',jibun:c.jibun>=0?r[c.jibun]:'',jimok:c.jimok>=0?r[c.jimok]:'',use:c.use>=0?r[c.use]:'',
      area:+String(r[c.area]||'').replace(/,/g,'')||0,amount:+String(r[c.amt]||'').replace(/,/g,'')||0,ymd:ym.slice(0,4)+'.'+ym.slice(4,6)+(c.d>=0&&r[c.d]?'.'+String(r[c.d]).padStart(2,'0'):''),
      share:c.share>=0?r[c.share]:'',cancel:c.cancel>=0&&r[c.cancel]&&r[c.cancel]!=='-'?r[c.cancel]:''})}
  if(!rows.length)throw new Error('거래 행을 찾지 못했어요');
  return rows;
}

/* ---------- 계산 ---------- */
function analyze(){
  const L=S.land,ld=L.land||{};
  const area=+ld.lndpclAr||0;
  const prices=(L.prices||[]).filter(p=>p.price>0);
  const nowP=prices.length?prices[prices.length-1]:null;
  const p5=prices.length>=2?prices[Math.max(0,prices.length-6)]:null;
  const cagr=(nowP&&p5&&nowP.year>p5.year)?Math.pow(nowP.price/p5.price,1/(nowP.year-p5.year))-1:null;
  const dongNm=String(ld.ldCodeNm||L.address||'').trim().split(/\s+/).filter(x=>!/^산$/.test(x)).slice(-1)[0]||'';
  let comps=[];
  if(S.trades){
    comps=S.trades.filter(t=>t.area>0&&t.amount>0&&!t.cancel);
    if(!S.opt.share)comps=comps.filter(t=>!/지분/.test(t.share));
    if(S.opt.scope==='dong'&&dongNm)comps=comps.filter(t=>t.dong.includes(dongNm));
    if(S.opt.jimok&&ld.lndcgrCodeNm)comps=comps.filter(t=>t.jimok===ld.lndcgrCodeNm);
    if(S.opt.use&&ld.prposArea1Nm)comps=comps.filter(t=>normUse(t.use)===normUse(ld.prposArea1Nm));
    comps.forEach(t=>t.unit=t.amount*1e4/t.area);
    comps.sort((a,b)=>b.ymd.localeCompare(a.ymd));
  }
  const units=comps.map(t=>t.unit);const n=units.length;
  const conf=n>=10?'hi':n>=3?'mid':'lo';
  let m1=null;
  if(n&&area){const q1=n>=4?quant(units,.25):Math.min(...units),q3=n>=4?quant(units,.75):Math.max(...units),md=quant(units,.5);
    m1={lo:q1*area,mid:md*area,hi:q3*area,uLo:q1,uMid:md,uHi:q3,n}}
  let m2=null;
  if(nowP&&area){m2={lo:nowP.price*area*S.opt.lo,hi:nowP.price*area*S.opt.hi,mid:nowP.price*area*(S.opt.lo+S.opt.hi)/2,base:nowP.price*area}}
  const ratio=(m1&&nowP)?m1.uMid/nowP.price:null;
  let w1=n>=5?0.7:n>=3?0.5:0;
  if(!m2)w1=m1?1:0;if(!m1)w1=0;
  const mix=k=>(m1?m1[k]*w1:0)+(m2?m2[k]*(1-w1):0);
  const final=(m1||m2)?{lo:mix('lo'),mid:mix('mid'),hi:mix('hi'),w1}:null;
  return{area,prices,nowP,cagr,dongNm,comps,n,conf,m1,m2,ratio,final,ld};
}

  document.body.classList.add('pv');fitPreview();$('#report').scrollTop=0;
  // A4 한 쪽(297mm)을 넘는 쪽 표시
  const isOver=p=>p.offsetHeight/p.offsetWidth>297/210+0.01;const over=pages.map((p,i)=>isOver(p)?i+1:0).filter(Boolean);
  pages.forEach(p=>p.classList.toggle('over',isOver(p)));
  const old=$('#pvwarn');if(old)old.remove();
  if(over.length){const d=document.createElement('div');d.id='pvwarn';d.textContent=over.join('·')+'쪽 내용이 A4 한 장보다 길어 인쇄 시 다음 장으로 넘어갑니다. 상담 멘트를 줄이면 2쪽에 맞습니다.';$('#report').prepend(d)}
  history.pushState({pv:1},'')}
function closePreview(fromPop){if(!document.body.classList.contains('pv'))return;document.body.classList.remove('pv');if(!fromPop&&history.state&&history.state.pv)history.back()}
$('#pvClose').onclick=()=>closePreview();
$('#pvPrint').onclick=()=>window.print();
addEventListener('popstate',()=>closePreview(true));
addEventListener('resize',()=>{if(document.body.classList.contains('pv'))fitPreview()});
addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});

/* ---------- 리포트 ---------- */
function buildReport(){

  $('#report').innerHTML=`
  <div class="rp">
    <div class="meta">토지 시세 상담 리포트 · ${today}</div>
    <h1>${S.cust?esc(S.cust)+' 님 · ':''}${esc(L.address)}</h1>
    <table><tr><th>지목</th><td>${esc(A.ld.lndcgrCodeNm||'-')}</td><th>면적</th><td>${A.area.toLocaleString()}㎡ (${(A.area*PY).toFixed(1)}평)</td></tr>
    <tr><th>용도지역</th><td>${esc(A.ld.prposArea1Nm||'-')}</td><th>이용상황</th><td>${esc(A.ld.ladUseSittnNm||'-')}</td></tr>
    <tr><th>도로접면</th><td>${esc(A.ld.roadSideCodeNm||'-')}</td><th>지형</th><td>${esc([A.ld.tpgrphHgCodeNm,A.ld.tpgrphFrmCodeNm].filter(Boolean).join('·')||'-')}</td></tr>
    <tr><th>개별공시지가</th><td colspan="3">${A.nowP?A.nowP.year+'년 ㎡당 '+A.nowP.price.toLocaleString()+'원 (합계 '+won(A.nowP.price*A.area)+')'+(A.cagr!=null?' · 최근 5년 연평균 '+(A.cagr*100).toFixed(1)+'%':''):'-'}</td></tr></table>
    <h2>시세 범위</h2>
    <div class="box"><div class="range">${wonShort(f.lo)} ~ ${wonShort(f.hi)}원</div>
      <div>중심값 약 ${won(f.mid)} · 평당 ${wonShort(perPy(f.lo/A.area))} ~ ${wonShort(perPy(f.hi/A.area))}원 · 비교사례 신뢰도 ${CONF_TXT[A.conf]}(${A.n}건)</div></div>
    <h2>산정 근거</h2>
    <table><tr><th>방식</th><th>범위</th><th>근거</th><th>반영</th></tr>
      <tr><td>① 실거래 비교</td><td>${A.m1?wonShort(A.m1.lo)+' ~ '+wonShort(A.m1.hi):'-'}</td><td style="text-align:left">${A.m1?`${S.opt.scope==='dong'?esc(A.dongNm):'시·군·구'} ${S.opt.jimok?esc(A.ld.lndcgrCodeNm||'')+' ':''}${A.n}건, ㎡당 ${Math.round(A.m1.uLo).toLocaleString()}~${Math.round(A.m1.uHi).toLocaleString()}원`:'비교사례 없음'}</td><td>${Math.round(f.w1*100)}%</td></tr>
      <tr><td>② 공시지가 배율</td><td>${A.m2?wonShort(A.m2.lo)+' ~ '+wonShort(A.m2.hi):'-'}</td><td style="text-align:left">${A.m2?'공시지가 합계 '+wonShort(A.m2.base)+' × '+S.opt.lo+'~'+S.opt.hi+'배':'-'}</td><td>${Math.round((1-f.w1)*100)}%</td></tr></table>
    ${A.prices.length?`<h2>개별공시지가 추이(원/㎡)</h2><table><tr>${A.prices.slice(-8).map(p=>'<th>'+p.year+'</th>').join('')}</tr><tr>${A.prices.slice(-8).map(p=>'<td>'+p.price.toLocaleString()+'</td>').join('')}</tr></table>`:''}
    <div class="office">${off}</div>
  </div>
  <div class="rp">
    <h2>비교 실거래 사례${A.n>20?' (최근 20건)':''}</h2>
    ${A.n?`<table><tr><th>계약일</th><th>위치</th><th>지목</th><th>면적(㎡)</th><th>거래금액</th><th>㎡당</th><th>평당</th></tr>${A.comps.slice(0,20).map(t=>`<tr><td>${esc(t.ymd)}</td><td>${esc(t.dong.split(' ').slice(-1)[0])} ${esc(t.jibun)}</td><td>${esc(t.jimok)}</td><td>${t.area.toLocaleString()}</td><td>${wonShort(t.amount*1e4)}</td><td>${Math.round(t.unit).toLocaleString()}</td><td>${wonShort(perPy(t.unit))}</td></tr>`).join('')}</table>
    <div class="meta">자료: ${esc(S.tradeSrc)} · 해제거래${S.opt.share?'':'·지분거래'} 제외 · 번지 일부는 공개 자료에서 가려져 있습니다.</div>`:'<p>조건에 맞는 비교 실거래 사례가 없습니다.</p>'}
    <h2>매도자 상담</h2><div class="ment">${esc(ms)}</div>
    <h2>매수자 상담</h2><div class="ment">${esc(mb)}</div>
    <div class="disc">이 리포트는 국토교통부 실거래가·개별공시지가·토지특성 공공데이터를 바탕으로 한 <b>참고용 시세 범위이며 감정평가가 아닙니다</b>. 개별 필지의 도로·형상·경사·인허가 가능성·권리관계·지분 여부에 따라 실제 거래가격은 달라질 수 있습니다. 거래 결정 전 토지이용계획확인원·등기사항증명서 등 공적 서류와 현장을 반드시 확인하시기 바랍니다.</div>
    <div class="office">${off}</div>
  </div>`;
}

/* ---------- 시작 ---------- */
(async()=>{render();const tk=token();if(tk){try{S.me=await rpc('lh_me',{p_token:tk});render()}catch(e){}}})();
addEventListener('storage',e=>{if(e.key===TK){S.me=null;render();const tk=token();if(tk)rpc('lh_me',{p_token:tk}).then(m=>{S.me=m;render()}).catch(()=>{})}});
})();
</script>
