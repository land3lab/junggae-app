<script>

const REGIONS=['서울남부','서울동부','서울북부','서울서부','경기남부','경기북부','경기서부','인천','강원','충청','대구경북','부산경남','전라'];

/* ---------- 표시 ---------- */
function man(won){if(won==null||won==='')return'';const m=Math.round(won/1e4);if(m>=1e4){const e=Math.floor(m/1e4),r=m%1e4;return e+'억'+(r?' '+r.toLocaleString():'')}return m.toLocaleString()}
function priceText(l){if(l.deal==='매매')return['매매 '+(man(l.price)||'-'),''];if(l.deal==='전세')return['전세 '+(man(l.deposit)||'-'),''];
  return[(man(l.deposit)||'0')+' / '+(man(l.rent)||'0'),l.deal==='단기'?'단기 · 만원':'만원']}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dday=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const daysSince=ts=>Math.floor((Date.now()-new Date(ts))/864e5);
function ago(ts){const d=daysSince(ts);return d<=0?'오늘':d===1?'어제':d+'일 전'}
function area(l){return l.area?`${(+l.area).toLocaleString()}㎡(${(l.area*PY).toFixed(1)}평)`:''}
function floorT(l){return l.floor?(l.floor+(/[층F]$/i.test(l.floor)?'':'층')+(l.total_floor?'/'+l.total_floor+'층':'')):''}
function roomsT(l){return[l.rooms!=null?'방'+l.rooms:'',l.baths!=null?'욕실'+l.baths:''].filter(Boolean).join('·')}
const tel=x=>String(x||'').replace(/\D/g,''),fmtTel=x=>{const d=tel(x);return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d.length===10?d.replace(/(\d{2,3})(\d{3,4})(\d{4})/,'$1-$2-$3'):d};
function stTag(s){return `<span class="tag ${s==='광고중'?'':s==='계약진행'?'y':s==='계약완료'?'g':s==='접수'?'k':'m'}">${esc(s)}</span>`}
function adsOpen(l){return(l.ads||[]).filter(a=>!a.down)}
function flags(l){const out=[];const act=ACTIVE.includes(l.status);
  if(act&&daysSince(l.confirmed_at)>14)out.push(['y','확인 '+daysSince(l.confirmed_at)+'일 전']);
  if(!act&&adsOpen(l).length)out.push(['r','광고 내리세요']);
  if(l.status==='광고중'){const s=adsOpen(l).filter(a=>a.end&&dday(a.end)<=3);if(s.length)out.push(['r',dday(s[0].end)<0?'광고 만료 지남':'광고 D-'+dday(s[0].end)])}
  return out}
function card(l){const[p,u]=priceText(l);
  return `<button class="it" data-id="${l.id}"><div class="th" style="${l.thumb?`background-image:url(${l.thumb})`:''}">${l.thumb?'':'🏠'}</div><div class="bd">
    <div class="top">${stTag(l.status)}<span class="tag m">${esc(l.deal)}</span><span>${esc(l.kind)}</span>${l.photo_n?`<span>📷${l.photo_n}</span>`:''}${l.lh_light?`<span>${l.lh_light==='초록'?'🟢':l.lh_light==='노랑'?'🟡':'🔴'}LH</span>`:''}${l.gs_id?'<span>🤝공실클럽</span>':''}</div>

    <div class="ad">${esc(l.addr)} ${esc(l.ho||'')}</div>

    ${flags(l).length?`<div class="top" style="margin-top:4px">${flags(l).map(([c,t])=>`<span class="tag ${c}">${t}</span>`).join('')}</div>`:''}
  </div></button>`}

/* ---------- 화면 ---------- */
function render(){

function shrink(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=async()=>{try{ok(await shrinkUrl(fr.result))}catch(e){no(e)}};fr.readAsDataURL(file)})}
async function shrinkUrl(src,max0=1280,lim=280000){const im=await loadImg(src);let q=.72,max=max0,out='';
  for(let i=0;i<6;i++){const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<lim)break;q-=.1;max=Math.round(max*.85)}return out}

function csvParse(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}

    <div class="card"><h2>② 다방광고 매물 옮기기</h2>
      <p class="hint" style="margin:0 0 8px">② 다방광고 원클릭은 매물을 이 기기에만 저장해 왔어요. 매물장으로 옮기면 다른 기기에서도 보이고 ⑥·⑩과 연결됩니다(② 쪽 자료는 그대로 남음).</p>
      ${dl.length?`<b>${left.length}건 옮길 수 있음</b>${done.length?` <span class="hint">(이미 옮긴 ${dl.length-left.length}건 제외)</span>`:''}<div class="row" style="margin-top:8px"><button class="btn pri" id="fromD" ${left.length?'':'disabled'}>② 매물 ${left.length}건 옮기기</button></div>`:'<p class="hint">이 기기의 ② 다방광고에 저장된 매물이 없어요.</p>'}
      <div id="dMsg"></div></div>
    <div class="card"><h2>엑셀(CSV) 가져오기</h2>
      <p class="hint" style="margin:0 0 8px">지금 쓰는 엑셀 매물장을 "다른 이름으로 저장 → CSV UTF-8"로 저장해 올리세요. 첫 줄 제목(주소·보증금·월세·매매가·면적·층·의뢰인·연락처·메모 등)을 보고 칸을 자동으로 맞춥니다. 금액은 <b>만원 단위</b>로 읽습니다.</p>
      <div class="row"><button class="btn sm" id="tpl">빈 양식 내려받기</button></div>
      <input type="file" id="csvF" accept=".csv,text/csv,.txt" style="margin-top:10px"><div id="csvBox"></div></div>`;
  $('#exp').onclick=()=>{const lines=[COLS.map(c=>c[1]).join(',')].concat(S.list.map(l=>COLS.map(([k])=>csvCell(MONEY.includes(k)?(l[k]==null?'':Math.round(l[k]/1e4*10)/10):(k==='created_at'||k==='confirmed_at')?(l[k]||'').slice(0,10):l[k])).join(',')));
    dlFile('매물장_'+today()+'.csv','﻿'+lines.join('\r\n'))};
  $('#tpl').onclick=()=>dlFile('매물장_양식.csv','﻿'+COLS.slice(0,25).map(c=>c[1]).join(',')+'\r\n접수,월세,원룸,서울남부,서울 관악구 봉천동 1598-1,301호,,1000,50,,7,23.5,,3,5,1,1,남향,불가,즉시,에어컨 세탁기,역 5분,김OO,010-0000-0000,수수료 법정\r\n');
  const fd=$('#fromD');if(fd)fd.onclick=()=>fromDabang(left);
  $('#csvF').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;let txt=await f.text();
    if(/�/.test(txt.slice(0,2000))){try{txt=new TextDecoder('euc-kr').decode(await f.arrayBuffer())}catch(e){}}
    previewCsv(csvParse(txt))}}
function dlFile(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function normDeal(s){s=String(s||'');return /매매/.test(s)?'매매':/단기/.test(s)?'단기':/월/.test(s)?'월세':/전세/.test(s)?'전세':''}
function normKind(s){s=String(s||'').replace(/\s/g,'');if(!s)return'';const hit=KINDS.find(k=>k.replace(/\s/g,'')===s);if(hit)return hit;
  if(/원룸/.test(s))return'원룸';if(/투룸|2룸/.test(s))return'투룸';if(/쓰리|3룸/.test(s))return'쓰리룸+';if(/오피/.test(s))return'오피스텔';if(/아파/.test(s))return'아파트';if(/빌라|다세대|연립/.test(s))return'빌라';
  if(/단독|다가구/.test(s))return'단독·다가구';if(/상가|점포/.test(s))return'상가';if(/사무/.test(s))return'사무실';if(/지식|지산/.test(s))return'지식산업센터';if(/공장|창고/.test(s))return'공장·창고';if(/토지|대지|임야|전|답/.test(s))return'토지';if(/건물|빌딩/.test(s))return'건물';return'기타'}
function previewCsv(rows){const box=$('#csvBox');if(rows.length<2){box.innerHTML='<div class="note r">제목 줄과 자료가 있는 CSV가 아니에요.</div>';return}
  const head=rows[0].map(h=>h.replace(/\s|\(.*?\)/g,''));const map={};
  Object.entries(ALIAS).forEach(([k,al])=>{let i=head.findIndex(h=>al.includes(h));if(i<0)i=head.findIndex(h=>al.some(a=>a.length>1&&h.includes(a)));if(i>=0&&!Object.values(map).includes(i))map[k]=i});
  const recs=rows.slice(1).map(r=>{const o={};Object.entries(map).forEach(([k,i])=>o[k]=(r[i]||'').trim());
    o.deal=normDeal(o.deal)||(o.price&&!o.deposit?'매매':o.rent&&+String(o.rent).replace(/[^\d.]/g,'')>0?'월세':o.deposit?'전세':'');o.kind=normKind(o.kind)||'기타';
    if(!['접수','광고중','계약진행','계약완료','보류','철회'].includes(o.status))o.status=/완료/.test(o.status||'')?'계약완료':/광고/.test(o.status||'')?'광고중':/보류/.test(o.status||'')?'보류':'접수';
    if(!REGIONS.includes(o.region))o.region='';
    MONEY.forEach(k=>{const x=String(o[k]||'').replace(/[^\d.]/g,'');o[k]=x?String(Math.round(parseFloat(x)*1e4)):''});return o}).filter(o=>o.addr);
  const bad=recs.filter(o=>!o.deal).length,hasOwner=recs.some(o=>o.owner_name||o.owner_phone);
  box.innerHTML=`<div class="note g">읽은 칸: ${Object.keys(map).map(k=>(COLS.find(c=>c[0]===k)||[,k])[1]).join(', ')||'(없음)'}</div>
    <div class="pvwrap"><table class="pv"><tr><th>거래</th><th>유형</th><th>주소</th><th>보증금</th><th>월세</th><th>매매가</th><th>의뢰인</th></tr>${recs.slice(0,30).map(o=>`<tr><td>${esc(o.deal||'❓')}</td><td>${esc(o.kind)}</td><td>${esc(o.addr)} ${esc(o.ho||'')}</td><td>${man(o.deposit)}</td><td>${man(o.rent)}</td><td>${man(o.price)}</td><td>${esc(o.owner_name||'')}</td></tr>`).join('')}</table></div>
    <p class="hint">${recs.length}건${recs.length>30?' (앞 30건만 미리보기)':''}${bad?` · 거래 유형을 못 읽은 ${bad}건은 "월세"로 넣습니다`:''}</p>
    ${hasOwner?`<label class="chk"><input type="checkbox" id="impConsent"><span>가져오는 의뢰인 정보는 모두 <b>개인정보 수집·이용 동의</b>를 받았습니다. (체크하지 않으면 의뢰인 이름·연락처는 빼고 가져옵니다)</span></label>`:''}
    <button class="btn pri" id="impGo" style="margin-top:10px">${recs.length}건 매물장에 넣기</button><div id="impMsg"></div>`;
  $('#impGo').onclick=async()=>{const c=$('#impConsent'),ok=c&&c.checked;const b=$('#impGo');b.disabled=true;let n=0,fail=0;
    for(const o of recs){if(!o.deal)o.deal='월세';const d=Object.assign({},o,{consent:!!ok,nogeo:true});if(!ok){d.owner_name='';d.owner_phone=''}
      try{await rpc('mj_save',{p_id:null,p_d:d});n++}catch(e){fail++;if(/1,000건/.test(e.message))break}b.textContent=`넣는 중… ${n+fail}/${recs.length}`}
    $('#impMsg').innerHTML=`<div class="note g">${n}건 넣었어요${fail?` (${fail}건 실패)`:''}. 지도 위치를 찾는 중…</div>`;await loadList();geoFill()}}
async function fromDabang(arr){const b=$('#fromD');b.disabled=true;let n=0;const done=LS.get('d1c.imported',null)||LS.get('mj.imported',[]);
  const idbGet=k=>new Promise(res=>{try{const r=indexedDB.open('d1c',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{try{const q=r.result.transaction('photos').objectStore('photos').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}});
  const toUrl=bl=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(bl)});
  for(const x of arr){const D=x.data||{};const m2w=v=>{const s=String(v??'').replace(/[^\d.]/g,'');return s?String(Math.round(parseFloat(s)*1e4)):''};
    const deal=D.deal==='단기임대'?'단기':(DEALS.includes(D.deal)?D.deal:'월세');
    const st=x.status==='거래완료'?'계약완료':x.status==='보류'?'보류':'광고중';
    const data={deal,kind:KINDS.includes(D.type)?D.type:'기타',addr:D.addr||'(주소 없음)',ho:[D.dong,D.ho].filter(Boolean).join(' '),bldg:D.bldgName||'',
      deposit:m2w(D.deposit),rent:m2w(D.rent),price:m2w(D.price),mgmt:m2w(D.mgmtTotal||D.mgmtAvg),area:D.area||'',supply:D.supply||'',floor:D.floor||'',total_floor:D.totalFloor||'',
      rooms:D.rooms||'',baths:D.baths||'',dir:D.dir||'',park:D.parkTotal!=null&&D.parkTotal!==''?D.parkTotal+'대':'',elevator:D.elevator==='있음'?'true':D.elevator==='없음'?'false':'',approve:D.approve||'',
      move_in:D.moveMode==='now'?'즉시입주':D.moveMode==='date'?(D.moveDate||''):D.moveMode==='nego'?((D.moveMonth||'')+' '+(D.movePart||'')+' 협의').trim():'',
      options:(D.options||[]).join(', '),memo:D.memo||'',status:st,consent:false,nogeo:true};
    try{const j=await rpc('mj_save',{p_id:null,p_d:data});
      await rpc('mj_ads',{p_id:j.id,p_ads:[{ch:'다방',start:x.adStart||'',end:x.adEnd||'',down:!!x.takenDown||false}]});
      const bl=await idbGet(x.id);if(Array.isArray(bl)&&bl.length){const urls=[];for(const p of bl.slice(0,8)){const u=await toUrl(p);if(u)urls.push(await shrinkUrl(u))}
        if(urls.length)await rpc('mj_photos_set',{p_id:j.id,p_photos:urls,p_thumb:await thumbOf(urls[0])})}
      done.push(x.id);LS.set('mj.imported',done);n++;b.textContent=`옮기는 중… ${n}/${arr.length}`}
    catch(e){$('#dMsg').innerHTML=`<div class="note r">${esc(D.addr||'')}: ${esc(e.message)}</div>`}}
  $('#dMsg').innerHTML=`<div class="note g">${n}건 옮겼어요. 지도 위치를 찾는 중…</div>`;await loadList();geoFill()}
async function geoFill(){for(let i=0;i<400;i++){let j;try{j=await rpc('mj_geo_fill')}catch(e){break}if(!j.left||(!j.filled&&!j.left))break}await loadList();if(S.tab==='list')render();toast('지도 위치 찾기 끝')}

/* ---------- 시작 ---------- */
async function loadList(){S.list=await rpc('mj_list')||[]}
async function boot(){if(!token()){S.me=null;render();return}
  try{S.me=await rpc('lh_me');await loadList()}catch(e){if(token())$('#app').innerHTML=`<div class="note r">${esc(e.message)}</div>`;else render();return}
  render()}
addEventListener('storage',e=>{if(e.key===TK)boot()});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.me&&S.tab==='list'&&!document.querySelector('.modal')){try{await loadList();paneList()}catch(e){}}});
boot();
})();
</script>
</body>
