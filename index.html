<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중개사무소 앱 — 중개사 실전 도구 8종</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{--bg:#F7F7F7;--ink:#23292B;--sub:#5C6366;--line:#E6E6E6;--brand:#EE6A2C;--brand-soft:#FDEEE5;--red:#b42318;--red-soft:#fdecea;--yel:#7a5400;--yel-soft:#fff4d6;--grn:#17733f;--grn-soft:#e4f4ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5;display:flex;flex-direction:column;height:100dvh}
.top{background:#fff;color:var(--ink);flex:none;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 12px 0;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;letter-spacing:-.3px;flex:1;white-space:nowrap;display:flex;align-items:center;gap:10px;color:var(--ink)}
.top h1 img{height:46px;width:auto;display:block}
.top h1 .bar{width:1px;height:26px;background:var(--line)}
.top h1 small{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.who{font-size:12.5px;color:var(--sub);text-align:right}
.ibtn{min-height:36px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
nav.tabs{max-width:1100px;margin:0 auto;display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;min-height:44px;border:0;border-radius:10px 10px 0 0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;padding:8px 13px;border-bottom:3px solid transparent!important;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--brand-soft);color:var(--l3-deep,#C9531B);border-bottom-color:var(--l3-orange,#F77235)!important}
nav.tabs button.soon{color:#A3A8AA;font-weight:500}
nav.tabs button .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F77235;margin-left:5px;vertical-align:middle}
#stage{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow:auto;display:none}
.pane.on{display:block}
.pane iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.home{max-width:1100px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
h2.sec{font-size:15px;margin:18px 2px 8px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:96px}
.stat:hover{border-color:#F5A47C}
.stat b{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .s{font-size:12.5px;color:var(--sub)}
.stat.warn .v{color:var(--red)} .stat.good .v{color:var(--grn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tool{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;min-height:112px}
.tool:hover{border-color:#F5A47C;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.tool .num{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 8px}
.tool h3{font-size:16px;margin:8px 0 3px}
.tool p{margin:0;font-size:13px;color:var(--sub)}
.badge{position:absolute;right:12px;top:12px;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.b-on{background:var(--grn-soft);color:var(--grn)} .b-new{background:#fff1c9;color:#7a5400} .b-soon{background:#eef0ef;color:#6b736f}
.tool.dim{opacity:.7}
.login .grid2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:600}
input{width:100%;min-height:46px;border:1px solid #D6D6D6;border-radius:10px;padding:10px 12px;font:inherit;margin-top:4px}
.btn{min-height:46px;border:1px solid #D6D6D6;background:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.msg{font-size:13.5px;margin-top:8px}.msg.r{color:var(--red)}
.soonbox{max-width:620px;margin:40px auto;padding:0 16px;text-align:center}
.soonbox .card{text-align:left}
.soonbox ol{padding-left:20px;margin:8px 0;color:var(--sub);font-size:14.5px}
.foot{margin-top:18px;font-size:12.5px;color:var(--sub);text-align:center}
.recent{margin:0;padding:0;list-style:none}
.recent li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent li:last-child{border:0}
.recent li span:last-child{color:var(--brand);font-weight:700;white-space:nowrap}
@media (max-width:720px){nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 6px 0;overflow:visible}nav.tabs button{border-radius:10px 10px 0 0;padding:6px 2px;font-size:13px;min-height:44px}nav.tabs button.on{border-radius:10px 10px 0 0}.stats{grid-template-columns:1fr 1fr}.top h1 small{display:none}.top h1 img{height:30px}.top h1{font-size:15.5px;gap:8px}.login .grid2{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="land3.css">
</head>
<body>
<div class="top">
  <div class="in">
    <h1><img src="img/land3-logo.png" alt="랜드3 연구소"><span class="bar"></span><span>중개사무소 앱<small>중개사 실전 도구 8종</small></span></h1>
    <div class="who" id="who"></div>
    <button class="ibtn" id="installBtn" style="display:none">설치</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="stage"></div>

<script>
(function(){
"use strict";
const SB_URL="https://dwtylilyvmvbpsryvlcg.supabase.co", SB_KEY="sb_publishable_Vht7Hh-4GF-mpbnprPp3FQ_AgGPTKTH", TK="junggae-token";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const token=()=>{try{return localStorage.getItem(TK)||''}catch(e){return''}};
async function rpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>null);if(!r.ok){const m=(j&&j.message)||('서버 오류 '+r.status);if(m==='AUTH_REQUIRED'){try{localStorage.removeItem(TK)}catch(e){}}throw new Error(m)}return j}

/* 도구 목록 — 완성되면 page를 채우고 state를 'on'으로 */
const TOOLS=[
  {id:'lh',num:'⑤',short:'LH 신호등',name:'LH 전세임대 사전점검 신호등',desc:'등기부 PDF·사진 판독 → 공시가격 자동 조회 → LH 통과 가능성 신호등',page:'lh.html',state:'on'},
  {id:'dabang',num:'②',short:'다방광고',name:'다방광고 원클릭',desc:'1회 입력 → 표시광고 검사 → 다방·네이버·블로그·당근·밴드 원고 + 다방 자동입력',page:'dabang.html',state:'on'},
  {id:'land',num:'④',short:'토지 시세',name:'토지 얼마나 해요?',desc:'주소 1개 → 실거래·공시지가 근거 시세 범위 → 고객용 상담 리포트 PDF',page:'land.html',state:'on'},
  {id:'bid',num:'⑦',short:'입찰서류',name:'경매 입찰서류 자동작성',desc:'사건번호·입찰가 → 새 기일입찰표·위임장·준비물 체크리스트 PDF, "0 하나 더" 실수 방지',page:'bid.html',state:'on'},
  {id:'vacancy',num:'⑥',short:'공실클럽',name:'공실클럽 (RSA 동문 전용)',desc:'수수료·이용료 0원 동문 공동중개 — 공실 30초 등록·지도 검색·14일 신선도 확인·문의 일지',page:'gongsil.html',state:'new'},
  {id:'shorts',num:'③',short:'AI쇼츠',name:'AI쇼츠 만들기',desc:'② 매물·사진 → 훅·본문·마무리 대본 + 내 목소리 → 표시사항 고정 30초 세로영상 → 확인 후 유튜브 업로드',page:'shorts.html',state:'new'},
  {id:'blog',num:'⑧',short:'블로그',name:'블로그 자동생성',desc:'매물·동네·상식·상담사례 → 검색용 제목 5안·본문·태그 + 표시사항 자동 첨부 → 서식 복사·사진 내보내기·발행 기록',page:'blog.html',state:'new'},
  {id:'pc',num:'①',short:'똥컴 PC',name:'똥컴 업그레이드',desc:'오래된 사무실 PC 진단 → 처방 → 실행(윈도우 프로그램)',state:'soon',
    plan:['사양 자동 진단(CPU·RAM·HDD/SSD·부팅시간)','용도·예산 질문 3개','처방전: 0원 청소 / SSD·RAM / ChromeOS Flex','전후 비교 카드']}
];
const BADGE={on:'<span class="badge b-on">사용 가능</span>',new:'<span class="badge b-new">새로 나옴</span>',soon:'<span class="badge b-soon">준비 중</span>'};
let me=null,cur='home';const built={};

function tabsHtml(){return `<button data-t="home" class="${cur==='home'?'on':''}">🏠 홈</button>`+
  TOOLS.map(t=>`<button data-t="${t.id}" class="${cur===t.id?'on':''} ${t.state==='soon'?'soon':''}">${t.num} ${esc(t.short)}${t.state==='new'?'<span class="d"></span>':''}</button>`).join('')}
function renderTabs(){$('#tabs').innerHTML=tabsHtml();$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const on=$('#tabs .on');if(on)on.scrollIntoView({inline:'nearest',block:'nearest'})}
function renderWho(){$('#who').innerHTML=me?`${esc(me.office||'')} ${esc(me.name||'')} <button class="ibtn" id="lo" style="margin-left:6px">로그아웃</button>`:'';
  const lo=$('#lo');if(lo)lo.onclick=async()=>{const t=token();try{await rpc('lh_logout',{p_token:t})}catch(e){}try{localStorage.removeItem(TK)}catch(e){}me=null;gsInfo=null;reloadFrames();renderAll()}}

function pane(id){let p=document.getElementById('p-'+id);if(!p){p=document.createElement('div');p.className='pane';p.id='p-'+id;$('#stage').appendChild(p)}return p}
function go(id){
  if(id!=='home'&&!TOOLS.find(t=>t.id===id))id='home';
  cur=id;if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  const p=pane(id);p.classList.add('on');
  if(id==='home')renderHome();
  else if(!built[id]){const t=TOOLS.find(x=>x.id===id);built[id]=true;
    if(t.page){p.innerHTML=`<iframe src="${t.page}?embed=1" title="${esc(t.name)}" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>`}
    else p.innerHTML=`<div class="soonbox"><div class="card"><span class="tool"><span class="num">${t.num}</span></span><h3 style="margin:8px 0 4px">${esc(t.name)} <span class="badge b-soon" style="position:static">준비 중</span></h3><p style="color:var(--sub);margin:0 0 6px">${esc(t.desc)}</p><b style="font-size:14px">만들 기능</b><ol>${t.plan.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol></div></div>`}
  renderTabs();
}
function reloadFrames(except){document.querySelectorAll('.pane iframe').forEach(f=>{if(f.closest('.pane').id!=='p-'+except){try{f.contentWindow.location.reload()}catch(e){}}})}

/* ---------- 홈 ---------- */
let lhCount=null;
function renderHome(){
  const p=pane('home');
  const dl=LSget('d1c.listings',[]);const today=new Date();today.setHours(0,0,0,0);
  const dday=s=>{if(!s)return 99;const d=new Date(s);d.setHours(0,0,0,0);return Math.round((d-today)/864e5)};
  const onAd=dl.filter(x=>x.status==='광고중'),soon=onAd.filter(x=>dday(x.adEnd)<=3),noDown=dl.filter(x=>x.status==='거래완료'&&!x.takenDown);
  const hist=LSget('sise.history',[]);
  const bidsUp=LSget('bid.history',[]).map(b=>Object.assign({},b,{dd:b.date?dday(b.date):-1})).filter(b=>b.dd>=0).sort((a,b)=>a.dd-b.dd);
  const wonShort=v=>v>=1e8?(v/1e8).toFixed(v>=1e9?1:2).replace(/\.?0+$/,'')+'억':Math.round(v/1e4).toLocaleString()+'만';
  p.innerHTML=`<div class="home">
    ${me?'':`<div class="card login"><b>로그인</b> <span style="color:var(--sub);font-size:13.5px">— ⑤ LH 신호등·④ 토지 시세·② 건축물대장 자동조회에 쓰는 공용 계정입니다.</span>
      <div class="grid2" style="margin-top:8px"><label class="f">휴대폰 번호<input type="tel" id="ph" inputmode="numeric" placeholder="01012345678"></label>
      <label class="f">숫자 비밀번호<input type="password" id="pin" inputmode="numeric" placeholder="6~8자리"></label>
      <button class="btn pri" id="lg">로그인</button></div>
      <div class="msg" id="lmsg">처음이면 <a href="#lh" id="toSignup">⑤ LH 탭에서 가입</a>하세요(중개사 누구나, 무료).</div></div>`}
    <h2 class="sec">오늘 챙길 것</h2>
    <div class="stats">
      <button class="stat ${noDown.length?'warn':''}" data-go="dabang"><b>② 광고 내려야 할 매물</b><div class="v">${noDown.length}</div><div class="s">거래완료 후 광고 내림 미확인</div></button>
      <button class="stat ${soon.length?'warn':''}" data-go="dabang"><b>② 광고 만료 임박</b><div class="v">${soon.length}</div><div class="s">3일 이내 · 광고 중 ${onAd.length}건</div></button>
      <button class="stat good" data-go="lh"><b>⑤ LH 매물장</b><div class="v">${me?(lhCount==null?'…':lhCount):'-'}</div><div class="s">${me?'등록한 매물':'로그인하면 보여요'}</div></button>
      <button class="stat" data-go="land"><b>④ 토지 시세 상담</b><div class="v">${hist.length}</div><div class="s">${hist[0]?'최근: '+esc(hist[0].address.split(' ').slice(-3).join(' ')):'아직 조회 없음'}</div></button>
    </div>
    ${bidsUp.length?`<h2 class="sec">다가오는 입찰기일</h2><div class="card"><ul class="recent">${bidsUp.slice(0,5).map(b=>`<li><span>${esc(b.court)} ${esc(b.case)} · ${esc(b.name||'')}${b.type==='agent'?'(대리)':''}</span><span>${b.dd===0?'오늘':'D-'+b.dd}${b.price?' · '+wonShort(b.price):''}</span></li>`).join('')}</ul></div>`:''}
    ${gsInfo&&gsInfo.ok&&(gsInfo.unread||gsInfo.stale)?`<h2 class="sec">⑥ 공실클럽</h2><div class="card"><ul class="recent">${gsInfo.unread?`<li><span>새 공동중개 문의</span><span><a href="#vacancy">${gsInfo.unread}건 보기</a></span></li>`:''}${gsInfo.stale?`<li><span>"아직 공실인가요?" 확인할 내 공실</span><span><a href="#vacancy">${gsInfo.stale}건</a></span></li>`:''}</ul></div>`:''}
    ${blogHtml()}
    ${hist.length?`<h2 class="sec">최근 토지 시세 상담</h2><div class="card"><ul class="recent">${hist.slice(0,5).map(h=>`<li><span>${esc(h.address)}</span><span>${wonShort(h.lo)}~${wonShort(h.hi)}</span></li>`).join('')}</ul></div>`:''}
    <h2 class="sec">도구 8종</h2>
    <div class="grid">${TOOLS.map(t=>`<button class="tool ${t.state==='soon'?'dim':''}" data-go="${t.id}">${BADGE[t.state]}<span class="num">${t.num}</span><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></button>`).join('')}</div>
    <div class="foot">랜드3 연구소 · 모든 결과는 참고용 사전 점검이며 최종 판단은 관계기관·전문가 확인이 필요합니다.<br>② 다방광고 자료는 이 기기에만 저장됩니다.</div>
  </div>`;
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const ts=$('#toSignup');if(ts)ts.onclick=e=>{e.preventDefault();go('lh')};
  const lg=$('#lg');if(lg){const f=async()=>{try{const j=await rpc('lh_login',{p_phone:$('#ph').value,p_pin:$('#pin').value});
      if(j.error){$('#lmsg').className='msg r';$('#lmsg').textContent=j.error;return}
      localStorage.setItem(TK,j.token);me=j.member;reloadFrames();renderAll();loadLh()}catch(e){$('#lmsg').className='msg r';$('#lmsg').textContent=e.message}};
    lg.onclick=f;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')f()})}
}
function blogHtml(){const bh=LSget('bl.history',[]),cfg=LSget('bl.cfg',{goal:3}),dl=LSget('d1c.listings',[]);
  const d=new Date();d.setHours(0,0,0,0);const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const ms=mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
  const wk=bh.filter(h=>h.date>=ms).length,goal=cfg.goal||3;
  const down=bh.filter(h=>h.listingId&&!h.cleared&&(dl.find(x=>x.id===h.listingId)||{}).status==='거래완료');
  if(!bh.length&&!down.length)return'';
  return `<h2 class="sec">⑧ 블로그</h2><div class="card"><ul class="recent"><li><span>이번 주 발행</span><span><a href="#blog">${wk} / ${goal}편</a></span></li>${down.length?`<li><span style="color:var(--red)">거래완료 매물 글 — 정리 필요</span><span><a href="#blog">${down.length}건</a></span></li>`:''}</ul></div>`}
let gsInfo=null;
async function loadGs(){if(!token())return;try{gsInfo=await rpc('gs_me',{p_token:token()})}catch(e){gsInfo=null}if(cur==='home')renderHome()}
async function loadLh(){loadGs();if(!token())return;try{const l=await rpc('lh_list',{p_token:token()});lhCount=Array.isArray(l)?l.length:(l&&l.length)||0}catch(e){lhCount=null}if(cur==='home')renderHome()}
async function loadMe(){const t=token();if(!t){me=null;return}try{me=await rpc('lh_me',{p_token:t})}catch(e){me=token()?(me||{name:'',office:'(연결 확인 중)'}):null}}
function renderAll(){renderWho();renderTabs();if(cur==='home')renderHome()}

addEventListener('storage',async e=>{if(e.key===TK){await loadMe();lhCount=null;reloadFrames(cur);renderAll();loadLh()}else if(cur==='home')renderHome()});
addEventListener('hashchange',()=>go(location.hash.slice(1)||'home'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur==='home')renderHome()});

(async()=>{go(location.hash.slice(1)||'home');await loadMe();renderAll();loadLh()})();

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
let deferred=null;const b=$('#installBtn');
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;b.style.display="inline-flex"});
b.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;b.style.display="none"};
})();
</script>
