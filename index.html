<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중개사무소 앱 — 비서 데스크</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{--bg:#F5F5F4;--ink:#23292B;--sub:#5C6366;--faint:#8A9194;--line:#E6E6E6;--brand:#EE6A2C;--brand-soft:#FDEEE5;--deep:#C9531B;--char:#23292B;
  --red:#b42318;--red-soft:#fdecea;--yel:#7a5400;--yel-soft:#fff4d6;--grn:#17733f;--grn-soft:#e4f4ea;--blu:#1d4f91;--blu-soft:#e8f0fb;--side:236px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5;height:100dvh;display:flex;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--deep)}

/* ---------- 왼쪽 메뉴 ---------- */
#side{width:var(--side);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .logo{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#side .logo img{height:38px}
#side .logo span{font-size:12px;color:var(--sub);line-height:1.3}
#side nav{flex:1;overflow:auto;padding:8px 8px 16px}
.nv{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:10px;padding:9px 10px;min-height:42px;cursor:pointer;text-align:left;font-size:14.5px;font-weight:600;color:var(--ink)}
.nv:hover{background:#F6F6F5}
.nv.on{background:var(--brand-soft);color:var(--deep)}
.nv .n{flex:none;width:22px;height:22px;border-radius:7px;background:#F0F0EF;color:var(--sub);font-size:12px;font-weight:800;display:grid;place-items:center}
.nv.on .n{background:var(--brand);color:#fff}
.nv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .c{flex:none;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.nv .c.soft{background:#FFE3D3;color:var(--deep)}
.nv.hm{font-size:15px;margin-bottom:4px}
.nv.hm .n{background:var(--char);color:#fff}
.grp{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.3px;padding:14px 10px 4px}
#side .me{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:8px}
#side .me b{color:var(--ink)}
.ibtn{min-height:32px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* ---------- 본문 ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{flex:none;height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.topbar .ttl{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:6px}
.topbar .mlogo{display:none;height:30px}
.askbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line);background:#FAFAF9;border-radius:999px;padding:4px 14px 4px 10px;cursor:pointer;font-size:13.5px;color:var(--sub)}
.askbtn .av{width:24px;height:24px}
#stage{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow:auto;display:none}
.pane.on{display:block}
.pane iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}

/* ---------- 비서 데스크 ---------- */
.desk{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
h2.sec{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-size:12px;font-weight:700;color:var(--sub);background:#F0F0EF;border-radius:999px;padding:1px 8px}
h2.sec .r{margin-left:auto;font-weight:500}
.hero{background:linear-gradient(135deg,#2B3234 0%,#23292B 60%,#3A2A22 100%);color:#fff;border:0;border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(247,114,53,.35),rgba(247,114,53,0) 70%)}
.hero .hd{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1}
.av{width:52px;height:52px;flex:none;display:block}
.hero .hi{font-size:13px;color:#C9CED0}
.hero h1{font-size:21px;margin:2px 0 4px;letter-spacing:-.4px;line-height:1.35}
.hero .say{font-size:15px;color:#F2F3F3;min-height:23px}
.hero .say .cur{display:inline-block;width:2px;height:16px;background:#F77235;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.scan{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.scan span{font-size:12px;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.08);color:#D9DDDE;display:inline-flex;align-items:center;gap:5px;opacity:0;animation:pop .3s ease forwards}
.scan span.ok::before{content:"✓";color:#7FD8A3;font-weight:800}
.scan span.wait::before{content:"";width:9px;height:9px;border:2px solid #F77235;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.scan span.off{color:#9AA1A3}
.scan span.off::before{content:"–"}
.scan.still span{animation:none;opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.ask{margin-top:14px;position:relative;z-index:1}
.ask form{display:flex;gap:6px;background:#fff;border-radius:14px;padding:5px}
.ask input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 10px;color:var(--ink);background:transparent}
.ask button[type=submit]{border:0;background:var(--brand);color:#fff;font-weight:800;border-radius:10px;padding:0 16px;cursor:pointer;min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#EDEFEF;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:32px}
.chips button:hover{background:rgba(247,114,53,.25);border-color:#F77235}
.sugg{margin-top:8px;display:grid;gap:6px}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.sugg button .n{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--brand);border-radius:7px;padding:2px 7px}
.sugg button .x{flex:1;font-size:14px}
.sugg button .x small{display:block;color:var(--sub);font-size:12.5px}
.sugg button .go{font-weight:800;color:var(--deep);font-size:13px;white-space:nowrap}
.sugg .no{color:#D9DDDE;font-size:13.5px;padding:4px 2px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;min-height:84px}
.kpi:hover{border-color:#F5A47C}
.kpi b{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:2px}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.warn .v{color:var(--red)}

.cols{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;margin-top:12px;align-items:start}
.stack{display:grid;gap:12px}

.lvl{font-size:12px;font-weight:800;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.lvl:first-of-type{margin-top:0}
.lvl i{font-style:normal;width:8px;height:8px;border-radius:50%}
.lvl.u{color:var(--red)} .lvl.u i{background:var(--red)}
.lvl.t{color:var(--deep)} .lvl.t i{background:#F77235}
.lvl.w{color:var(--blu)} .lvl.w i{background:#4A7BC8}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F0F0EF}
.task:last-child{border-bottom:0}
.task .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #CFD3D4;background:#fff;cursor:pointer;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#fff;padding:0}
.task .ck:hover{border-color:var(--brand)}
.task .bd{flex:1;min-width:0}
.task .tt{font-weight:700;font-size:14.5px}
.task .dt{font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task .tg{display:inline-block;font-size:11.5px;font-weight:700;color:var(--sub);background:#F0F0EF;border-radius:6px;padding:0 6px;margin-right:4px}
.task .act{flex:none;border:1px solid #F5C2A6;background:var(--brand-soft);color:var(--deep);font-weight:800;font-size:13px;border-radius:9px;padding:6px 11px;cursor:pointer;min-height:36px;white-space:nowrap}
.task .act:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.task.done .ck{background:var(--grn);border-color:var(--grn)}
.donebox summary{cursor:pointer;font-size:13px;color:var(--sub);margin-top:8px}
.empty{text-align:center;padding:18px 8px;color:var(--sub);font-size:14px}
.empty .big{font-size:30px}

.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:2px}
.flow button{border:0;background:transparent;cursor:pointer;padding:8px 4px;text-align:center;position:relative}
.flow button:not(:last-child)::after{content:"›";position:absolute;right:-5px;top:20px;color:#C5C9CA;font-size:20px;font-weight:700}
.flow .v{font-size:21px;font-weight:800;line-height:1.2}
.flow .l{font-size:12px;color:var(--sub);font-weight:600}
.flow .n{font-size:11px;color:var(--faint);background:none}
.flow button:hover .v{color:var(--deep)}

.cal{margin:0;padding:0;list-style:none}
.cal .day{font-size:12px;font-weight:800;color:var(--sub);margin:10px 0 2px}
.cal .day:first-child{margin-top:0}
.cal .day.td{color:var(--deep)}
.cal li.ev{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13.5px;cursor:pointer;border-radius:8px}
.cal li.ev:hover{background:#FAFAF9}
.cal .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#F77235}
.cal .dot.b{background:#4A7BC8} .cal .dot.g{background:#2E9E5E} .cal .dot.r{background:var(--red)} .cal .dot.k{background:#8A9194}
.cal .ev .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev .tm{flex:none;font-size:12px;color:var(--faint)}

.feed{margin:0;padding:0;list-style:none}
.feed li{display:flex;gap:10px;padding:7px 0;font-size:13.5px;border-bottom:1px solid #F3F3F2;cursor:pointer}
.feed li:last-child{border:0}
.feed .ic{flex:none;width:26px;height:26px;border-radius:8px;background:#F3F3F2;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--sub)}
.feed .w{flex:1;min-width:0}
.feed .w div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .w small{color:var(--faint);font-size:12px}

.tgrp{margin-top:18px}
.tgrp h3{font-size:13px;color:var(--sub);margin:0 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tool{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;position:relative;min-height:92px}
.tool:hover{border-color:#F5A47C;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.tool .num{font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 8px}
.tool h4{font-size:15px;margin:6px 0 2px}
.tool p{margin:0;font-size:12.5px;color:var(--sub)}
.tool .c{position:absolute;right:12px;top:12px;font-size:11.5px;font-weight:800;border-radius:999px;background:var(--red);color:#fff;padding:1px 8px}

.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:600}
.login input{width:100%;min-height:44px;border:1px solid #D6D6D6;border-radius:10px;padding:9px 12px;font:inherit;margin-top:4px}
.btn{min-height:44px;border:1px solid #D6D6D6;background:#fff;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{min-height:32px;padding:3px 10px;font-size:12.5px}
.msg{font-size:13px;margin-top:6px;color:var(--sub)}.msg.r{color:var(--red)}
.foot{margin-top:22px;font-size:12px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--char);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}

/* ---------- 휴대폰 ---------- */
#bnav{display:none}
#dim{display:none}
@media (max-width:900px){
  body{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-102%);transition:transform .2s ease;box-shadow:8px 0 30px rgba(0,0,0,.12)}
  body.drawer #side{transform:none}
  body.drawer #dim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  #main{height:100dvh;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .topbar .mlogo{display:block}
  .topbar .ttl small{display:none}
  #bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #bnav button{border:0;background:transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;position:relative}
  #bnav button svg{width:22px;height:22px}
  #bnav button.on{color:var(--deep)}
  #bnav button .c{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
  .kpis{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(3,1fr);row-gap:6px}
  .flow button:nth-child(3)::after{display:none}
  .login{grid-template-columns:1fr}
  .hero h1{font-size:19px}
  .askbtn .tx{display:none}
  .askbtn{padding:4px 8px}
  .toast{bottom:84px}
}
@media (prefers-reduced-motion:reduce){.scan span{animation:none;opacity:1}.hero .say .cur{animation:none}}
</style>

const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dday=s=>{if(!s)return 99;const d=new Date(s);if(isNaN(d))return 99;d.setHours(0,0,0,0);return Math.round((d-today0())/864e5)};
const md=s=>{const d=new Date(s);return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()};
const ago=s=>{const t=new Date(s).getTime();if(isNaN(t))return'';const m=Math.round((Date.now()-t)/6e4);if(m<1)return'방금';if(m<60)return m+'분 전';const h=Math.round(m/60);if(h<24)return h+'시간 전';const d=Math.round(h/24);return d<8?d+'일 전':md(s)};
const wonShort=v=>!v?'':v>=1e8?(v/1e8).toFixed(v>=1e9?1:2).replace(/\.?0+$/,'')+'억':Math.round(v/1e4).toLocaleString()+'만';

function collect(){
  const dl=LSget('d1c.listings',[]),lab=x=>{const d=x.data||{};return [d.addr&&d.addr.split(' ').slice(-2).join(' '),d.type,d.deal].filter(Boolean).join(' ')||'매물'};
  const onAd=dl.filter(x=>x.status==='광고중'),adSoon=onAd.filter(x=>dday(x.adEnd)<=3),noDown=dl.filter(x=>x.status==='거래완료'&&!x.takenDown);
  const bids=LSget('bid.history',[]).map(b=>Object.assign({},b,{dd:b.date?dday(b.date):-1})).filter(b=>b.dd>=0).sort((a,b)=>a.dd-b.dd);
  const bh=LSget('bl.history',[]),cfg=LSget('bl.cfg',{goal:3});
  const mon=today0();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const ms=ymd(mon);
  const blogWk=bh.filter(h=>h.date>=ms).length,goal=cfg.goal||3;
  const blogDown=bh.filter(h=>h.listingId&&!h.cleared&&(dl.find(x=>x.id===h.listingId)||{}).status==='거래완료');
  const sh=LSget('sh.history',[]),shDown=sh.filter(h=>!h.down&&h.listingId&&(dl.find(x=>x.id===h.listingId)||{}).status==='거래완료');
  const J=LSget('pub.jobs',[]),now=Date.now(),eod=new Date();eod.setHours(23,59,59,999);const slots=[];
  J.forEach(j=>Object.entries(j.slots||{}).forEach(([k,x])=>{if(x.done||!x.at)return;slots.push({ch:k,at:x.at,label:j.label||j.blogTitle||'매물',t:new Date(x.at).getTime()})}));
  const pubDue=slots.filter(s=>s.t<=now),pubToday=slots.filter(s=>s.t>now&&s.t<=eod.getTime());

  return {dl,lab,onAd,adSoon,noDown,bids,bh,blogWk,goal,blogDown,sh,shDown,slots,pubDue,pubToday,sise,pch};
}

function buildCal(D){
  const E=[];const push=(date,dot,w,tool,tm)=>{const dd=dday(date);if(dd<0||dd>7)return;E.push({dd,date,dot,w,tool,tm:tm||''})};
  D.bids.forEach(b=>push(b.date,'r',`입찰 ${b.court||''} ${b.case||''}`,'bid','10:00'));

function buildFeed(D){

  const bn=[['home','비서'],['listings','매물'],['dabang','광고'],['customers','고객'],['all','전체']];
  $('#bnav').innerHTML=bn.map(([id,l])=>{const n=id==='home'?total:id==='all'?0:(c[id]||0);const on=id==='all'?!['home','listings','dabang','customers'].includes(cur):cur===id;
    return `<button data-b="${id}" class="${on?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[id]}</svg>${l}${n?`<span class="c">${n}</span>`:''}</button>`}).join('');
  $('#bnav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.b;if(id==='all')document.body.classList.add('drawer');else go(id)});
}
function renderWho(){$('#who').innerHTML=me?`<span style="flex:1;min-width:0"><b>${esc(me.name||'')}</b><br>${esc(me.office||'')}</span><button class="ibtn" id="lo">로그아웃</button>`:`<span style="flex:1">로그인 전</span><button class="ibtn" id="toLogin">로그인</button>`;
  const lo=$('#lo');if(lo)lo.onclick=async()=>{const t=token();try{await rpc('lh_logout',{p_token:t})}catch(e){}try{localStorage.removeItem(TK)}catch(e){}me=null;gsInfo=null;jg=null;lhCount=null;remote={lh:'off',jg:'off',gs:'off'};reloadFrames();renderAll()};
  const tl=$('#toLogin');if(tl)tl.onclick=()=>{go('home');document.body.classList.remove('drawer');setTimeout(()=>{const p=$('#ph');if(p)p.focus()},50)}}

function pane(id){let p=document.getElementById('p-'+id);if(!p){p=document.createElement('div');p.className='pane';p.id='p-'+id;$('#stage').appendChild(p)}return p}
function go(id){
  if(id!=='home'&&!T(id))id='home';
  cur=id;if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  const p=pane(id);p.classList.add('on');
  const t=T(id);$('#ttl').innerHTML=t?`${t.num} ${esc(t.name)}`:'비서 데스크<small>오늘 할 일을 비서가 정리했어요</small>';
  if(id==='home')renderHome();
  else if(!built[id]){built[id]=true;p.innerHTML=`<iframe src="${t.page}?embed=1" title="${esc(t.name)}" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>`}
  renderNav();
}
function reloadFrames(except){document.querySelectorAll('.pane iframe').forEach(f=>{if(f.closest('.pane').id!=='p-'+except){try{f.contentWindow.location.reload()}catch(e){}}})}

/* ---------- 화면: 비서 데스크 ---------- */
function greet(){const h=new Date().getHours();return h<5?'늦은 시간까지 수고 많으세요':h<11?'좋은 아침이에요':h<14?'점심 맛있게 드세요':h<18?'오후도 힘내세요':'오늘 하루 수고 많으셨어요'}
function sayLine(open,urgent){if(!open)return'오늘은 급한 일이 없어요. 새 매물 등록이나 블로그 글 한 편 어떠세요?';
  return `오늘 챙길 일 ${open}건을 정리했어요.`+(urgent?` 급한 일 ${urgent}건부터 처리하세요.`:' 급한 일은 없어요.')}
function renderHome(){
  const p=pane('home');const D=collect();const tasks=buildTasks(D);lastTasks=tasks;const dn=doneSet();
  const open=tasks.filter(t=>!dn.has(t.id)),urgent=open.filter(t=>t.lvl==='u').length;
  const cal=buildCal(D),feed=buildFeed(D);
  const name=me&&me.name?me.name+' 대표님':'대표님';
  const scan=[['⑨ 매물장',me?(remote.jg==='ok'?'ok':remote.jg):'off',jg?'진행 '+jg.mj_active:''],['⑩ 고객',me?(remote.jg==='ok'?'ok':remote.jg):'off',jg?'연락 '+jg.cr_due_n:''],
    ['② 광고','ok','광고중 '+D.onAd.length],['⑪ 발행 예약','ok',D.slots.length+'건'],['⑧ 블로그','ok','이번 주 '+D.blogWk],['③ 쇼츠','ok',D.sh.length+'편'],
    ['⑦ 입찰','ok',D.bids.length?'예정 '+D.bids.length:'예정 없음'],['⑥ 공실클럽',me?(remote.gs==='ok'?(gsInfo&&gsInfo.ok?'ok':'off'):remote.gs):'off',gsInfo&&gsInfo.ok?'문의 '+(gsInfo.unread||0):''],
    ['⑤ LH',me?(remote.lh==='ok'?'ok':remote.lh):'off',lhCount!=null?lhCount+'건':''],['④ 시세','ok','상담 '+D.sise.length]];
  const line=sayLine(open.length,urgent);curLine=line;
  const taskHtml=t=>`<div class="task ${dn.has(t.id)?'done':''}"><button class="ck" data-ck="${esc(t.id)}" aria-label="완료 표시">${dn.has(t.id)?'✓':''}</button>
      <div class="bd"><div class="tt">${esc(t.title)}</div><div class="dt"><span class="tg">${T(t.tool).num} ${esc(T(t.tool).short)}</span>${esc(t.detail)}</div></div>
      <button class="act" data-go="${t.tool}">${esc(t.cta)}</button></div>`;
  const LV=[['u','긴급 — 지금 처리'],['t','오늘'],['w','이번 주']];
  const report=open.length?LV.map(([k,l])=>{const a=open.filter(t=>t.lvl===k);return a.length?`<div class="lvl ${k}"><i></i>${l} ${a.length}</div>`+a.map(taskHtml).join(''):''}).join('')
    :`<div class="empty"><div class="big">☕</div>${tasks.length?'오늘 할 일을 모두 끝냈어요!':'지금 챙길 일이 없어요.'}<br><span style="font-size:13px">${me?'새 매물을 등록하면 광고·블로그·쇼츠까지 이어서 챙겨 드려요.':'로그인하면 매물장·고객 일정까지 함께 챙겨 드려요.'}</span></div>`;
  const doneList=tasks.filter(t=>dn.has(t.id));
  const flow=[['listings',jg?jg.mj_active:D.dl.filter(x=>x.status!=='거래완료').length,'매물 접수',jg?'매물장':'광고 매물'],['dabang',D.onAd.length,'광고 중','다방·네이버'],
    ['blog',D.blogWk+D.sh.filter(h=>dday(h.at)>-7).length,'콘텐츠','이번 주 글·쇼츠'],['publish',D.slots.length,'발행 예약','블로그·인스타'],
    ['customers',jg?jg.cr_due_n:'-','손님 연락','오늘'],['customers',jg?(jg.cr_events||[]).length:'-','계약 일정','7일 안']];
  let lastDay=null;const calHtml=cal.length?cal.slice(0,10).map(e=>{let h='';if(e.dd!==lastDay){lastDay=e.dd;const d=new Date(e.date);h=`<li class="day ${e.dd===0?'td':''}">${e.dd===0?'오늘':e.dd===1?'내일':(d.getMonth()+1)+'/'+d.getDate()+' ('+WK[d.getDay()]+')'}</li>`}
      return h+`<li class="ev" data-go="${e.tool}"><span class="dot ${e.dot}"></span><span class="w">${esc(e.w)}</span><span class="tm">${esc(e.tm)}</span></li>`}).join('')
    :`<div class="empty" style="padding:8px">7일 안에 잡힌 일정이 없어요.</div>`;
  const feedHtml=feed.length?feed.map(f=>`<li data-go="${f.tool}"><span class="ic">${f.num}</span><span class="w"><div>${esc(f.w)}</div><small>${ago(f.at)}</small></span></li>`).join(''):`<div class="empty" style="padding:8px">아직 작업 기록이 없어요.</div>`;
  const tc=countFor(tasks);
  p.innerHTML=`<div class="desk">
    <div class="hero">
      <div class="hd"><svg class="av" viewBox="0 0 52 52" aria-hidden="true"><use href="#avatar"/></svg>
        <div style="flex:1;min-width:0"><div class="hi">${new Date().getMonth()+1}월 ${new Date().getDate()}일 ${WK[new Date().getDay()]}요일 · 랜드3 비서</div>
        <h1>${greet()}, ${esc(name)}.</h1><div class="say" id="say">${sayI>=0&&sayI<line.length?esc(line.slice(0,sayI))+'<span class="cur"></span>':firstPaint?'<span class="cur"></span>':esc(line)}</div></div></div>
      <div class="scan ${firstPaint?'':'still'}">${scan.map(([l,s,n],i)=>`<span class="${s}" style="animation-delay:${i*90}ms">${esc(l)}${s==='ok'&&n?' · '+esc(n):s==='off'?' · 로그인 필요':''}</span>`).join('')}</div>
      <div class="ask"><form id="askF" autocomplete="off"><input id="askIn" placeholder="비서에게 시키기 — 예: 봉천동 투룸 광고 만들어줘" value="${esc(typed)}" enterkeyhint="go"><button type="submit">시키기</button></form>
        <div class="sugg" id="sugg"></div>
        <div class="chips">${[['listings','새 매물 등록'],['dabang','광고 원고'],['blog','블로그 글'],['shorts','쇼츠 영상'],['publish','한 번에 발행'],['land','토지 시세'],['bid','입찰표'],['customers','손님 연락']].map(([t,l])=>`<button type="button" data-go="${t}">${l}</button>`).join('')}</div></div>
    </div>
    ${me?'':`<div class="card" style="margin-top:12px"><b>로그인하고 비서에게 사무실 맡기기</b> <span style="color:var(--sub);font-size:13px">— 매물장·고객 일정·공실클럽·LH까지 한 번에 챙겨 드려요. (⑤ LH와 같은 계정)</span>
      <div class="login"><label class="f">휴대폰 번호<input type="tel" id="ph" inputmode="numeric" placeholder="01012345678"></label>
      <label class="f">숫자 비밀번호<input type="password" id="pin" inputmode="numeric" placeholder="6~8자리"></label>
      <button class="btn pri" id="lg">로그인</button></div>
      <div class="msg" id="lmsg">처음이면 <a href="#lh" id="toSignup">⑤ LH 탭에서 가입</a>하세요(중개사 누구나, 무료).</div></div>`}
    <div class="kpis">
      <button class="kpi" data-go="listings"><b>진행 중 매물</b><div class="v">${jg?jg.mj_active:(me?'…':D.dl.filter(x=>x.status!=='거래완료').length)}<small>건</small></div><div class="s">${jg?'14일 미확인 '+jg.mj_stale:'② 광고 매물 기준'}</div></button>
      <button class="kpi" data-go="dabang"><b>광고 중</b><div class="v">${D.onAd.length}<small>건</small></div><div class="s">3일 안 만료 ${D.adSoon.length}</div></button>
      <button class="kpi ${jg&&jg.cr_due_n?'warn':''}" data-go="customers"><b>오늘 연락할 손님</b><div class="v">${jg?jg.cr_due_n:'-'}<small>${jg?'명':''}</small></div><div class="s">${jg?'계약 일정 '+(jg.cr_events||[]).length:'로그인하면 보여요'}</div></button>
      <button class="kpi" data-go="blog"><b>이번 주 블로그</b><div class="v">${D.blogWk}<small>/ ${D.goal}편</small></div><div class="s">쇼츠 ${D.sh.length}편 · 예약 ${D.slots.length}</div></button>
    </div>
    <div class="cols">
      <div class="card"><h2 class="sec">📋 오늘의 업무 보고 <span class="cnt">${open.length}</span><span class="r"><button class="btn sm" id="copyRep">카톡용 복사</button></span></h2>
        ${report}
        ${doneList.length?`<details class="donebox"><summary>오늘 끝낸 일 ${doneList.length}건</summary>${doneList.map(taskHtml).join('')}</details>`:''}
      </div>
      <div class="stack">
        <div class="card"><h2 class="sec">🗓 다가오는 일정 <span class="cnt">7일</span></h2><ul class="cal">${calHtml}</ul></div>
        <div class="card"><h2 class="sec">🧾 최근 작업</h2><ul class="feed">${feedHtml}</ul></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px"><h2 class="sec">🔗 업무 흐름 <span style="font-size:12.5px;color:var(--sub);font-weight:500">매물 한 건이 계약까지 가는 길 — 단계를 누르면 그 도구로 이동</span></h2>
      <div class="flow">${flow.map(([t,v,l,n])=>`<button data-go="${t}"><div class="v">${v}</div><div class="l">${l}</div><div class="n">${n}</div></button>`).join('')}</div></div>
    ${GROUPS.map(([g,l])=>`<div class="tgrp"><h3>${l}</h3><div class="grid">${TOOLS.filter(t=>t.g===g).map(t=>`<button class="tool" data-go="${t.id}">${tc[t.id]?`<span class="c">${tc[t.id]}</span>`:''}<span class="num">${t.num}</span><h4>${esc(t.name)}</h4><p>${esc(t.desc)}</p></button>`).join('')}</div></div>`).join('')}
    <div class="foot">랜드3 연구소 · 모든 결과는 참고용 사전 점검이며 최종 판단은 관계기관·전문가 확인이 필요합니다.<br>②·③·⑧·⑪ 자료는 이 기기에만 저장되고, ⑤·⑥·⑨·⑩은 로그인 계정에 저장됩니다.</div>
  </div>`;
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  p.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.ck));
  const ts=$('#toSignup');if(ts)ts.onclick=e=>{e.preventDefault();go('lh')};
  const ai=$('#askIn');ai.oninput=()=>{typed=ai.value;renderSugg(ai.value)};renderSugg(typed);
  $('#askF').onsubmit=e=>{e.preventDefault();const q=ai.value;const r=route(q);if(r.length){typed='';runIntent(r[0],q)}else renderSugg(q||' ')};
  $('#copyRep').onclick=()=>{const txt=`[${ymd(today0())} 업무 보고]\n`+(open.length?LV.map(([k,l])=>{const a=open.filter(t=>t.lvl===k);return a.length?`■ ${l}\n`+a.map(t=>'- '+t.title+' ('+t.detail+')').join('\n'):''}).filter(Boolean).join('\n'):'오늘 챙길 일 없음')+(cal.length?'\n■ 7일 일정\n'+cal.slice(0,8).map(e=>'- '+md(e.date)+' '+e.w).join('\n'):'');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('업무 보고를 복사했어요 — 카톡에 붙여넣으세요')).catch(()=>toast('복사가 안 되는 브라우저예요'))};
  const lg=$('#lg');if(lg){const f=async()=>{try{const j=await rpc('lh_login',{p_phone:$('#ph').value,p_pin:$('#pin').value});
      if(j.error){$('#lmsg').className='msg r';$('#lmsg').textContent=j.error;return}
      localStorage.setItem(TK,j.token);me=j.member;remote={lh:'wait',jg:'wait',gs:'wait'};reloadFrames();renderAll();loadLh()}catch(e){$('#lmsg').className='msg r';$('#lmsg').textContent=e.message}};
    lg.onclick=f;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')f()})}
  if(firstPaint){firstPaint=false;typeLine()}
  renderNav();
}
function typeLine(){const el=$('#say');if(!el)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=curLine;return}
  sayI=0;const step=()=>{const e=$('#say');sayI++;if(e)e.innerHTML=esc(curLine.slice(0,sayI))+(sayI<curLine.length?'<span class="cur"></span>':'');if(sayI<curLine.length)setTimeout(step,28)};setTimeout(step,500)}

/* ---------- 서버 자료 ---------- */
const reHome=()=>{if(cur==='home')renderHome();else{const D=collect();lastTasks=buildTasks(D);renderNav()}};
async function loadJg(){if(!token()){remote.jg='off';return}try{jg=await rpc('jg_today',{p_token:token()});remote.jg='ok'}catch(e){jg=null;remote.jg='off'}reHome()}
async function loadGs(){if(!token()){remote.gs='off';return}try{gsInfo=await rpc('gs_me',{p_token:token()});remote.gs='ok'}catch(e){gsInfo=null;remote.gs='off'}reHome()}
async function loadLh(){loadGs();loadJg();if(!token()){remote.lh='off';reHome();return}try{const l=await rpc('lh_list',{p_token:token()});lhCount=Array.isArray(l)?l.length:(l&&l.length)||0;remote.lh='ok'}catch(e){lhCount=null;remote.lh='off'}reHome()}
async function loadMe(){const t=token();if(!t){me=null;remote={lh:'off',jg:'off',gs:'off'};return}try{me=await rpc('lh_me',{p_token:t})}catch(e){me=token()?(me||{name:'',office:'(연결 확인 중)'}):null}}
function renderAll(){renderWho();if(cur==='home')renderHome();else reHome()}

addEventListener('storage',async e=>{if(e.key===TK){await loadMe();lhCount=null;reloadFrames(cur);renderAll();loadLh()}else reHome()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'home';if(h!==cur)go(h);if(h==='home')loadJg()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){reHome();if(cur==='home')loadJg()}});
$('#dim').onclick=()=>document.body.classList.remove('drawer');
$('#askTop').onclick=()=>{go('home');setTimeout(()=>{const a=$('#askIn');if(a){a.focus();a.scrollIntoView({block:'center'})}},30)};
const mq=matchMedia('(max-width:900px)');const mb=$('#menuBtn');const syncMb=()=>{mb.style.display=mq.matches?'inline-flex':'none'};syncMb();mq.addEventListener&&mq.addEventListener('change',syncMb);
mb.onclick=()=>document.body.classList.add('drawer');

(async()=>{go(location.hash.slice(1)||'home');await loadMe();renderAll();loadLh()})();

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
let deferred=null;const b=$('#installBtn');
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;b.style.display="inline-flex"});
b.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;b.style.display="none"};
})();
</script>
</body>
