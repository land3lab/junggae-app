<html lang="ko">
<head>
<meta charset="utf-8">

<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed")</script>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{--bg:#F7F7F7;--card:#fff;--ink:#23292B;--sub:#5C6366;--line:#E6E6E6;--brand:#EE6A2C;--brand-soft:#FDEEE5;
  --red:#b42318;--red-soft:#fdecea;--yel:#7a5400;--yel-soft:#fff4d6;--grn:#17733f;--grn-soft:#e4f4ea;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:16px}
header h1{margin:0;font-size:19px;letter-spacing:-.3px}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
.embed header{display:none}
.wrap{max-width:960px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{font-size:16.5px;margin:0 0 10px}
label.f{display:block;font-size:13.5px;color:var(--sub);font-weight:600}
input[type=text],input[type=tel],input[type=search],select,textarea{width:100%;min-height:46px;border:1px solid #D6D6D6;border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff;margin-top:4px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #F9B48F;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;border:1px solid #D6D6D6;background:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{min-height:44px;padding:8px 12px;font-size:14px}
.btn.red{color:var(--red);border-color:#f0c4bf}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid #D6D6D6;border-radius:10px;overflow:hidden;margin-top:4px;flex-wrap:nowrap}
.seg button{flex:1;min-height:44px;border:0;background:#fff;font:inherit;font-weight:700;color:var(--sub);cursor:pointer;padding:0 6px;white-space:nowrap}
.seg button+button{border-left:1px solid #D6D6D6}
.seg button.on{background:var(--brand);color:#fff}
.hint{font-size:13px;color:var(--sub);margin:4px 0 0}
.note{padding:11px 14px;border-radius:12px;font-size:14px;margin:10px 0 0}
.note.y{background:var(--yel-soft);color:var(--yel)} .note.r{background:var(--red-soft);color:var(--red)} .note.g{background:var(--grn-soft);color:var(--grn)} .note.b{background:var(--brand-soft);color:var(--brand)}
.hide{display:none!important}
nav.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;position:sticky;top:0;z-index:20;background:var(--bg);padding:4px 0 8px}
nav.sub::-webkit-scrollbar{display:none}
nav.sub button{flex:none;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font:inherit;font-size:14.5px;font-weight:700;color:var(--sub);cursor:pointer;position:relative}
nav.sub button.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav.sub .bd{display:inline-block;min-width:19px;height:19px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;line-height:19px;text-align:center;margin-left:5px;padding:0 5px}
.filters{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}
.filters .q{grid-column:1/-1}
.res-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;gap:8px}
.res-head b{font-size:15px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:block;width:100%}
.it:hover{border-color:#F5A47C;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.it .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--brand-soft);color:var(--brand)}
.tag.m{background:#eef0ef;color:#4b5450}
.tag.y{background:var(--yel-soft);color:var(--yel)} .tag.r{background:var(--red-soft);color:var(--red)} .tag.g{background:var(--grn-soft);color:var(--grn)}
.it .pr{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:5px 0 1px}
.it .pr small{font-size:13px;font-weight:600;color:var(--sub);margin-left:4px}
.it .ad{font-size:14.5px;font-weight:600}
.it .sp{font-size:13.5px;color:var(--sub)}
.it .ow{display:flex;justify-content:space-between;gap:6px;border-top:1px dashed var(--line);margin-top:8px;padding-top:7px;font-size:13px;color:var(--sub)}
#map{height:62vh;min-height:360px;border-radius:14px;border:1px solid var(--line);background:#EBEBEB}
.both{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:start}
.both #map{position:sticky;top:64px;height:calc(100vh - 90px);min-height:420px}
.both .list{grid-template-columns:1fr;max-height:none}
.it.hl{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
@media (max-width:760px){.both{grid-template-columns:1fr}.both #map{position:relative!important;top:auto;height:46vh;min-height:300px}}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14.5px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,24,22,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.mh h3{margin:0;font-size:18px}
.x{min-width:44px;min-height:44px;border:0;background:#F2F2F2;border-radius:10px;font-size:20px;cursor:pointer}
.photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0 10px}
.photos img{height:220px;max-width:88%;object-fit:cover;border-radius:10px;scroll-snap-align:start;flex:none;background:#eee}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:14.5px;margin:8px 0}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:600}
.contact{background:var(--grn-soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.contact b{font-size:17px}
.inq{border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.inq:first-child{border-top:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.thumbs button{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:0;background:#23292B;color:#fff;cursor:pointer;font-size:15px;line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23292B;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
.toast.show{opacity:1}
.stale{background:var(--yel-soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--yel)}
.stale.r{background:var(--red-soft);color:var(--red)}
.mine .it{cursor:default}
.leaflet-popup-content{font-family:inherit;font-size:13.5px;line-height:1.45;margin:10px 12px}
.leaflet-popup-content .btn{min-height:36px;padding:4px 10px;font-size:13px;margin-top:6px}
@media (max-width:620px){.grid,.grid3{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters .rg{grid-column:1/-1}}
</style>

<body>
<header><h1>공실클럽</h1><p>중개사무소 앱 ⑥ · RSA 총동문회 동문 전용 · 수수료·이용료 0원 공동중개</p></header>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const VW_KEY="072D9167-7EB4-4FFE-9765-0EFA6F25F41B";
const SB_URL="https://dwtylilyvmvbpsryvlcg.supabase.co", SB_KEY="sb_publishable_Vht7Hh-4GF-mpbnprPp3FQ_AgGPTKTH", TK="junggae-token";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
const token=()=>{try{return localStorage.getItem(TK)||''}catch(e){return''}};
async function rpc(fn,args){
  let r;try{r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({p_token:token()},args||{}))})}catch(e){throw new Error('인터넷 연결을 확인하세요')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||('서버 오류 '+r.status);if(m==='AUTH_REQUIRED'){try{localStorage.removeItem(TK)}catch(e){}S.me=null;render()}throw new Error(m==='GS_NOT_MEMBER'?'동문 확인이 필요합니다':m)}
  return j}

const REGIONS=['서울남부','서울동부','서울북부','서울서부','경기남부','경기북부','경기서부','인천','강원','충청','대구경북','부산경남','전라'];
const DEALS=['월세','전세','매매','단기'];
const KINDS=['원룸','투룸','쓰리룸+','오피스텔','아파트','빌라','단독·다가구','상가','사무실','지식산업센터','공장·창고','토지','기타'];
const FEES=['각자 받기(일반 공동중개)','수수료 반반','협의','기타(메모 참고)'];
const PY=0.3025;

const S={me:null,tab:'find',f:LS.get('gs.filter',{region:'',deal:'',kind:'',maxDeposit:'',maxRent:'',maxPrice:'',q:''}),view:(v=>v==='list'?'list':'both')(LS.get('gs.view','both')),list:[],mine:[],busy:false,edit:null,photos:null,photosDirty:false};

/* ---------- 표시 ---------- */
function man(won){if(won==null||won==='')return'';const m=Math.round(won/1e4);if(m>=1e4){const e=Math.floor(m/1e4),r=m%1e4;return e+'억'+(r?' '+r.toLocaleString():'')}return m.toLocaleString()}
function priceText(l){if(l.deal==='매매')return['매매 '+man(l.price),''];if(l.deal==='전세')return['전세 '+man(l.deposit),''];
  return[(man(l.deposit)||'0')+' / '+(man(l.rent)||'0'),l.deal==='단기'?'단기 · 만원':'만원']}
function ago(ts){const d=Math.floor((Date.now()-new Date(ts))/864e5);return d<=0?'오늘':d===1?'어제':d+'일 전'}
function fresh(l){const d=Math.floor((Date.now()-new Date(l.confirmed_at))/864e5);return d>21?['r','숨김('+d+'일 미확인)']:d>14?['y',d+'일 전 확인']:['g',ago(l.confirmed_at)+' 확인']}
function area(l){return l.area?`${(+l.area).toLocaleString()}㎡(${(l.area*PY).toFixed(1)}평)`:''}
function card(l,mine){const[p,u]=priceText(l);const[fc,ft]=fresh(l);
  return `<button class="it" data-id="${l.id}">
    <div class="top"><span class="tag">${esc(l.deal)}</span><span class="tag m">${esc(l.kind)}</span>${l.status!=='공실'?`<span class="tag ${l.status==='완료'?'m':'y'}">${esc(l.status)}</span>`:''}<span>${esc(l.region)}</span>${l.photo_n?`<span>📷${l.photo_n}</span>`:''}<span style="margin-left:auto" class="tag ${fc}">${ft}</span></div>
    <div class="pr">${esc(p)}${u?`<small>${u}</small>`:''}${l.mgmt?`<small>관리비 ${man(l.mgmt)}만</small>`:''}</div>
    <div class="ad">${esc(l.addr)} ${esc(l.addr_detail||'')}</div>
    <div class="sp">${[area(l),l.floor,l.rooms,l.move_in&&'입주 '+l.move_in].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="ow"><span>💰 ${esc(l.fee||'협의')}</span><span>${mine?`문의 ${l.inq_n}건`:`${esc(l.owner?.office||'')} ${esc(l.owner?.name||'')}${l.owner?.cohort?' · '+l.owner.cohort+'기':''}`}</span></div>
  </button>`}

/* ---------- 화면 ---------- */
function render(){
  const A=$('#app');
  if(!token()||!S.me){A.innerHTML=`<div class="card"><h2>로그인이 필요해요</h2><p class="hint" style="font-size:14.5px">공실클럽은 중개사무소 앱 공용 계정으로 들어옵니다. 홈 탭에서 로그인하거나 ⑤ LH 탭에서 가입한 뒤 다시 열어 주세요.</p>
    <div class="row" style="margin-top:10px"><a class="btn pri" href="index.html#home" target="_top">홈으로 가서 로그인</a><button class="btn" id="retry">다시 확인</button></div></div>`;
    $('#retry').onclick=boot;return}
  const me=S.me;
  if(!me.ok){A.innerHTML=`<div class="card"><h2>RSA 총동문회 동문 전용입니다</h2>
    <p style="margin:0 0 8px">가입한 휴대폰 번호(${esc(me.name)} 님)가 동문 명단에서 확인되지 않았어요. 명단 번호가 다르거나 새 기수라면 확인 요청을 남겨 주세요 — 동문회 관리자가 승인합니다.</p>
    ${me.pending?`<div class="note y">확인 요청을 보냈어요. 승인되면 바로 쓸 수 있습니다.</div>`:''}
    <label class="f" style="margin-top:10px">기수·권역·명단상 연락처 등 확인용 메모<input type="text" id="reqNote" placeholder="예: 11기, 서울남부, 명단엔 010-xxxx 번호로 등록"></label>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="reqBtn">${me.pending?'요청 다시 보내기':'동문 확인 요청'}</button><button class="btn" id="retry">명단 다시 확인</button></div>
    <p class="hint">명단 확인은 휴대폰 번호를 암호화한 값으로만 대조합니다.</p></div>`;
    $('#reqBtn').onclick=async()=>{try{const j=await rpc('gs_request',{p_note:$('#reqNote').value});if(j.matched){toast('동문으로 확인됐어요');await boot()}else{toast('요청을 보냈어요');S.me.pending=true;render()}}catch(e){toast(e.message)}};
    $('#retry').onclick=boot;return}
  const tabs=[['find','🔎 찾기'],['new',S.edit?'✏️ 수정':'➕ 공실 등록'],['mine','📋 내 공실',me.stale],['inbox','💬 문의',me.unread]];
  if(me.admin)tabs.push(['admin','⚙ 관리',me.pending_n]);
  A.innerHTML=`<nav class="sub">${tabs.map(([k,t,b])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${t}${b?`<span class="bd">${b}</span>`:''}</button>`).join('')}</nav><div id="pane"></div>`;
  $$('nav.sub button').forEach(b=>b.onclick=()=>{if(b.dataset.tab!=='new')S.edit=null;S.tab=b.dataset.tab;if(S.tab==='new'&&!S.edit){S.photos=[];S.photosDirty=false}render()});
  ({find:paneFind,new:paneNew,mine:paneMine,inbox:paneInbox,admin:paneAdmin})[S.tab]();
}

/* ---------- 찾기 ---------- */
function paneFind(){const f=S.f;
  $('#pane').innerHTML=`<div class="card" style="padding:12px">
    <div class="filters">
      <label class="f rg">권역<select id="fRegion"><option value="">전체 권역</option>${REGIONS.map(r=>`<option ${f.region===r?'selected':''}>${r}</option>`).join('')}</select></label>
      <label class="f">거래<select id="fDeal"><option value="">전체</option>${DEALS.map(r=>`<option ${f.deal===r?'selected':''}>${r}</option>`).join('')}</select></label>
      <label class="f">유형<select id="fKind"><option value="">전체</option>${KINDS.map(r=>`<option ${f.kind===r?'selected':''}>${r}</option>`).join('')}</select></label>
      <label class="f">보증금 이하(만원)<input type="text" id="fDep" inputmode="numeric" value="${f.maxDeposit?f.maxDeposit/1e4:''}" placeholder="제한 없음"></label>
      <label class="f">월세 이하(만원)<input type="text" id="fRent" inputmode="numeric" value="${f.maxRent?f.maxRent/1e4:''}" placeholder="제한 없음"></label>
      <label class="f">매매가 이하(만원)<input type="text" id="fPrice" inputmode="numeric" value="${f.maxPrice?f.maxPrice/1e4:''}" placeholder="제한 없음"></label>
      <label class="f q">검색<input type="search" id="fQ" value="${esc(f.q)}" placeholder="동네·건물명·메모 (예: 봉천동, 역세권)"></label>
    </div></div>
  <div class="res-head"><b id="cnt">찾는 중…</b><div class="seg" style="margin:0;width:200px"><button data-v="both" class="${S.view!=='list'?'on':''}">지도+목록</button><button data-v="list" class="${S.view==='list'?'on':''}">목록만</button></div></div>
  <div id="res"></div>`;
  const num=v=>{const n=String(v).replace(/\D/g,'');return n?String(+n*1e4):''};
  let t=null;const go=()=>{clearTimeout(t);t=setTimeout(()=>{Object.assign(S.f,{region:$('#fRegion').value,deal:$('#fDeal').value,kind:$('#fKind').value,maxDeposit:num($('#fDep').value),maxRent:num($('#fRent').value),maxPrice:num($('#fPrice').value),q:$('#fQ').value.trim()});LS.set('gs.filter',S.f);load()},300)};
  ['#fRegion','#fDeal','#fKind'].forEach(s=>$(s).onchange=go);['#fDep','#fRent','#fPrice','#fQ'].forEach(s=>$(s).oninput=go);
  $$('.res-head .seg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;LS.set('gs.view',S.view);$$('.res-head .seg button').forEach(x=>x.classList.toggle('on',x===b));showRes()});
  load()}
async function load(){try{S.list=await rpc('gs_list',{p_f:S.f})||[];showRes()}catch(e){const r=$('#res');if(r)r.innerHTML=`<div class="note r">${esc(e.message)}</div>`}}
function showRes(){const r=$('#res');if(!r)return;const L=S.list;
  $('#cnt').textContent=`공실 ${L.length}건${S.f.region?' · '+S.f.region:''}`;
  if(S.map){try{S.map.remove()}catch(e){}S.map=null}
  const listHtml=L.length?`<div class="list">${L.map(l=>card(l,false)).join('')}</div>`

async function drawMap(L){try{await leaflet()}catch(e){$('#map').outerHTML=`<div class="note r">${esc(e.message)} — 목록으로 보세요.</div>`;return}
  const el=$('#map');if(!el)return;if(S.map){try{S.map.remove()}catch(e){}}const m=window.L.map(el,{scrollWheelZoom:true});S.map=m;S.marks={};
  // 바탕지도: VWorld(국토부) 우선, 타일 오류가 이어지면 OpenStreetMap으로 자동 전환
  const osm=()=>window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  if(/junggae-app\.vercel\.app$/.test(location.hostname)){let bad=0,ok=0;
    const vw=window.L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/'+VW_KEY+'/Base/{z}/{y}/{x}.png',{minZoom:6,maxZoom:19,attribution:'© VWorld 국토교통부'});
    vw.on('tileload',()=>ok++);vw.on('tileerror',()=>{if(++bad>=3&&!ok&&m.hasLayer(vw)){m.removeLayer(vw);osm().addTo(m)}});vw.addTo(m)}
  else osm().addTo(m);
  const pts=L.filter(l=>l.lat&&l.lng);const groups={};pts.forEach(l=>{const k=l.lat.toFixed(5)+','+l.lng.toFixed(5);(groups[k]=groups[k]||[]).push(l)});
  const bounds=[];Object.values(groups).forEach(g=>{const ll=[g[0].lat,g[0].lng];bounds.push(ll);

  const miss=L.length-pts.length;if(miss)$('#nomap').textContent=`주소 위치를 못 찾은 ${miss}건은 목록에서 보세요.`;

  let q=.72,max=1280,out='';for(let i=0;i<5;i++){const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<280000)break;q-=.1;max=Math.round(max*.85)}ok(out)};im.src=fr.result};fr.readAsDataURL(file)})}

  $$('#pane [data-s]').forEach(b=>b.onclick=async()=>{try{await rpc('gs_status',{p_id:b.dataset.id,p_status:b.dataset.s});toast('반영했어요');await refreshMe();render()}catch(e){toast(e.message)}})}

/* ---------- 문의함 ---------- */
async function paneInbox(){$('#pane').innerHTML='<div class="empty">불러오는 중…</div>';let j;
  try{j=await rpc('gs_inbox')}catch(e){$('#pane').innerHTML=`<div class="note r">${esc(e.message)}</div>`;return}
  const tel=x=>String(x||'').replace(/\D/g,'');S.me.unread=0;
  const row=(q,who,unread)=>`<div class="inq">${unread?'<span class="tag r">새 문의</span> ':''}<b>${esc(who.office)} ${esc(who.name)}</b>${who.cohort?' ('+who.cohort+'기)':''} · ${ago(q.at)}
    <br><a href="#" data-id="${q.listing.id}">${esc(q.listing.deal)} ${esc(q.listing.kind)} · ${esc(q.listing.addr)} ${esc(q.listing.addr_detail||'')}</a>${q.listing.status&&q.listing.status!=='공실'?' <span class="tag y">'+esc(q.listing.status)+'</span>':''}
    ${q.msg?'<br>“'+esc(q.msg)+'”':''}<br><a class="btn sm" style="margin-top:6px" href="tel:${tel(who.phone)}">📞 ${esc(who.phone)}</a></div>`;
  $('#pane').innerHTML=`<div class="card"><h2>받은 문의 (공동중개 일지)</h2>${j.received.length?j.received.map(q=>row(q,q.from,!q.read)).join(''):'<p class="hint">아직 받은 문의가 없어요.</p>'}</div>
    <div class="card"><h2>내가 한 문의</h2>${j.sent.length?j.sent.map(q=>row(q,q.to,false)).join(''):'<p class="hint">아직 문의한 공실이 없어요.</p>'}</div>
    <p class="hint">최근 180일 기록입니다. 누가 언제 문의했는지 남아 공동중개 분쟁 예방에 쓰입니다.</p>`;
  $$('#pane a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openDetail(a.dataset.id)});
  $$('nav.sub button[data-tab=inbox] .bd').forEach(x=>x.remove())}

/* ---------- 관리 ---------- */
async function paneAdmin(){$('#pane').innerHTML='<div class="empty">불러오는 중…</div>';let L;
  try{L=await rpc('gs_admin_list')}catch(e){$('#pane').innerHTML=`<div class="note r">${esc(e.message)}</div>`;return}
  $('#pane').innerHTML=`<div class="card"><h2>동문 확인 요청 ${L.length}건</h2>
    <p class="hint" style="margin:0 0 8px">동문 명단(동문이 앱 기준 503명, 2026-11-22 반영)에 휴대폰 번호가 없는 가입자입니다. 동문이 맞으면 승인하세요.</p>
    ${L.length?L.map(m=>`<div class="inq"><b>${esc(m.name)}</b> · ${esc(m.office)} · 등록번호 ${esc(m.reg_no)}<br>${esc(m.phone)} · ${ago(m.at)}${m.note?'<br>메모: '+esc(m.note):''}
      <div class="row" style="margin-top:6px"><button class="btn pri sm" data-ok="1" data-id="${m.id}">승인</button><button class="btn sm red" data-ok="0" data-id="${m.id}">거절</button></div></div>`).join(''):'<p class="hint">대기 중인 요청이 없어요.</p>'}</div>`;
  $$('#pane [data-ok]').forEach(b=>b.onclick=async()=>{try{await rpc('gs_admin_set',{p_member:b.dataset.id,p_ok:b.dataset.ok==='1'});toast(b.dataset.ok==='1'?'승인했어요':'거절했어요');await refreshMe();render()}catch(e){toast(e.message)}})}

/* ---------- 시작 ---------- */
async function refreshMe(){try{S.me=await rpc('gs_me')}catch(e){if(e.message!=='인터넷 연결을 확인하세요')S.me=null;else throw e}}
async function boot(){if(!token()){S.me=null;render();return}
  try{await refreshMe()}catch(e){$('#app').innerHTML=`<div class="note r">${esc(e.message)}</div>`;return}
  if(S.me&&S.me.ok&&!S.f.region&&S.me.region&&!LS.get('gs.filter',null)){S.f.region=REGIONS.includes(S.me.region)?S.me.region:''}
  render()}
addEventListener('storage',e=>{if(e.key===TK)boot()});
boot();
})();
</script>
</body>
