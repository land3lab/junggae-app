const KINDS=[['임차','임차 손님(전·월세 찾는)'],['매수','매수 손님'],['매도','매도 의뢰인'],['임대','임대 의뢰인(집주인)'],['투자','투자자'],['법인','법인'],['공동중개','동문·공동중개 상대']];

/* ---------- 표시 ---------- */
function man(won){if(won==null||won==='')return'';const m=Math.round(won/1e4);if(m>=1e4){const e=Math.floor(m/1e4),r=m%1e4;return e+'억'+(r?' '+r.toLocaleString():'')}return m.toLocaleString()}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};

const dday=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);

const md=s=>s?s.slice(5).replace('-','/'):'';
function ago(ts){const d=Math.floor((Date.now()-new Date(ts))/864e5);return d<=0?'오늘':d===1?'어제':d+'일 전'}
const tel=x=>String(x||'').replace(/\D/g,''),fmtTel=x=>{const d=tel(x);return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d.length===10?d.replace(/(\d{2,3})(\d{3,4})(\d{4})/,'$1-$2-$3'):d};

function priceText(l){if(l.deal==='매매')return'매매 '+(man(l.price)||'-');if(l.deal==='전세')return'전세 '+(man(l.deposit)||'-');return(l.deal==='단기'?'단기 ':'월세 ')+(man(l.deposit)||'0')+'/'+(man(l.rent)||'0')}
function lTitle(l){return `${priceText(l)} · ${l.kind} · ${l.addr.split(' ').slice(-2).join(' ')}${l.ho?' '+l.ho:''}`}
function wantsText(w){if(!w)return'';const a=[];if(w.deals&&w.deals.length)a.push(w.deals.join('/'));if(w.kinds&&w.kinds.length)a.push(w.kinds.join('·'));

function score(w,l){if(!w||!l)return 0;let s=100;const why=[];

  else{if(over(l.deposit,w.maxDeposit*1.1))return 0;if(over(l.deposit,w.maxDeposit)){s-=15;why.push('보증금 살짝 초과')}
    if(l.deal!=='전세'){if(over(l.rent,w.maxRent*1.15))return 0;if(over(l.rent,w.maxRent)){s-=15;why.push('월세 살짝 초과')}}}
  if(w.area){const ks=w.area.split(/[,\s/]+/).filter(Boolean);if(ks.length&&!ks.some(k=>(l.addr+' '+(l.bldg||'')+' '+(l.region||'')).includes(k))){s-=35;why.push('희망 지역 밖')}}
  if(w.minArea&&l.area&&+l.area<+w.minArea){s-=15;why.push('면적 작음')}
  if(w.minRooms&&l.rooms!=null&&l.rooms<+w.minRooms){s-=20;why.push('방 수 부족')}
  const m=w.must||[];
  if(m.includes('주차')&&(!l.park||/불가|없|^0/.test(l.park))){s-=15;why.push('주차?')}
  if(m.includes('엘리베이터')&&l.elevator!==true){s-=15;why.push('엘리베이터?')}
  if(m.includes('LH 전세임대')&&l.lh_light&&l.lh_light!=='초록'){s-=25;why.push('LH '+l.lh_light)}
  if(m.includes('반려동물')&&!/반려|애완|펫/.test((l.memo||'')+(l.options||''))){s-=5;why.push('반려동물 확인')}
  score.why=why;return Math.max(s,0)}
function matchesFor(c){if(!SEEK.includes(c.kind))return[];return S.mj.filter(l=>ACTIVE.includes(l.status)).map(l=>{const sc=score(c.wants,l);return{l,sc,why:score.why||[]}}).filter(x=>x.sc>=50).sort((a,b)=>b.sc-a.sc)}
function customersFor(l){return S.list.filter(c=>c.stage!=='종료'&&SEEK.includes(c.kind)).map(c=>{const sc=score(c.wants,l);return{c,sc,why:score.why||[]}}).filter(x=>x.sc>=50).sort((a,b)=>b.sc-a.sc||(a.c.temp>b.c.temp?1:-1))}

function csvParse(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function vcfParse(t){const out=[];t.split(/END:VCARD/i).forEach(b=>{const fn=(b.match(/^FN[^:]*:(.*)$/mi)||[])[1];const n=(b.match(/^N[^:]*:(.*)$/mi)||[])[1];const telM=(b.match(/^TEL[^:]*:(.*)$/mi)||[])[1];
  const name=(fn||(n?n.split(';').slice(0,2).reverse().join(''):'')||'').trim();if(name||telM)out.push({name:name||'(이름 없음)',phone:tel(telM||'')})});return out}
const csvCell=v=>{const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function dlFile(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

    const have=new Set(S.list.map(c=>c.phone).filter(Boolean));
    $('#impBox').innerHTML=`<p class="hint">${recs.length}명 읽음 — 가져올 사람을 고르세요. 이미 있는 번호는 빼 두었어요.</p>
      <div class="row"><button class="btn sm" id="selAll">모두 선택</button><label class="f" style="display:flex;gap:6px;align-items:center">종류<select id="impK" style="width:auto;margin:0">${KINDS.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label></div>
      <div class="pick">${recs.map((r,i)=>`<label><input type="checkbox" value="${i}" ${have.has(r.phone)?'disabled':''}><span>${esc(r.name)} ${fmtTel(r.phone)}${have.has(r.phone)?' <span class="tag m">이미 있음</span>':''}${r.memo?' · '+esc(r.memo.slice(0,40)):''}</span></label>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="impC"><span>고른 사람 모두 <b>개인정보 수집·이용 동의</b>를 받았습니다.</span></label>
      <button class="btn pri" id="impGo" style="margin-top:8px">가져오기</button>`;
    $('#selAll').onclick=()=>$$('#impBox .pick input:not(:disabled)').forEach(i=>i.checked=true);
    $('#impGo').onclick=async()=>{const sel=$$('#impBox .pick input:checked').map(i=>recs[+i.value]);if(!sel.length){toast('가져올 사람을 고르세요');return}if(!$('#impC').checked){toast('동의를 받았는지 체크하세요');return}
      const b=$('#impGo');b.disabled=true;let n=0;const dk=$('#impK').value;
      for(const r of sel){const k=KINDS.some(x=>x[0]===r.kind)?r.kind:dk;try{await rpc('cr_save',{p_id:null,p_d:{name:r.name,phone:r.phone,kind:k,temp:'C',stage:'진행',wants:{},memo:r.memo||'',consent:true,source:'',next_at:''}});n++;b.textContent=`가져오는 중… ${n}/${sel.length}`}catch(e){toast(r.name+': '+e.message)}}
      toast(n+'명 가져왔어요');await loadAll();S.tab='list';render()}}}

/* ---------- 매물장 → 맞는 손님 ---------- */
function checkMatch(){const j=LS.get('jg.match',null);if(!j||!S.me||Date.now()-j.at>10*60e3)return;try{localStorage.removeItem('jg.match')}catch(e){}
  const l=S.mj.find(x=>x.id===j.id);if(!l){toast('매물장에서 매물을 찾지 못했어요');return}
  const R=customersFor(l);
  const m=modal(`<div class="mh"><div><h3>이 매물에 맞는 손님 ${R.length}명</h3><div class="hint" style="margin:2px 0 0">🏠 ${esc(lTitle(l))}</div></div><button class="x">×</button></div>
    ${R.length?R.map(x=>`<div class="mt"><span><b>${esc(x.c.name)}</b> ${tempT(x.c.temp)}${(x.c.shown||[]).includes(l.id)?' <span class="tag m">안내함</span>':''}<br><span class="hint">${esc(wantsText(x.c.wants))}${x.why.length?' · '+esc(x.why.join(', ')):''}</span></span>
      <span style="text-align:right"><b style="color:var(--brand)">${x.sc}%</b><br>${x.c.phone?`<a class="btn sm" href="tel:${tel(x.c.phone)}" style="min-height:36px">📞</a> `:''}<button class="btn sm" data-c="${x.c.id}" style="min-height:36px">기록</button></span></div>`).join('')
      :`<p class="hint">찾는 조건이 맞는 손님이 아직 없어요. 고객의 "찾는 조건"(거래·유형·예산·지역)을 넣어 두면 다음부터 바로 골라 드립니다.</p>`}`);
  m.querySelector('.x').onclick=m.close;m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{m.close();openCust(b.dataset.c,'log',l.id)})}

/* ---------- 시작 ---------- */
async function loadAll(){const[a,b]=await Promise.all([rpc('cr_list'),rpc('mj_list').catch(()=>[])]);S.list=a||[];S.mj=b||[]}
async function boot(){if(!token()){S.me=null;render();return}
  try{S.me=await rpc('lh_me');await loadAll()}catch(e){if(token())$('#app').innerHTML=`<div class="note r">${esc(e.message)}</div>`;else render();return}
  render();checkMatch()}
addEventListener('storage',async e=>{if(e.key===TK)boot();else if(e.key==='jg.match'&&e.newValue){try{await loadAll();render()}catch(er){}checkMatch()}});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.me&&!document.querySelector('.modal')&&S.tab!=='new'){try{await loadAll();render()}catch(e){}checkMatch()}});
boot();
})();
</script>
</body>
</html>
